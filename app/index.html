// ================= Progress: level and daily routine =================
// Each finished position records {a: activity, acc: accuracy %, ts}. Kept privately per person
// in the artifact's database (data/users/<id>/trainer/results), or in this browser when that isn't
// available (e.g. outside claude.ai).
//
// LEVEL (0–100, one per activity) = your accuracy, smoothed over recent positions: the first
// CALIBRATION positions are a plain average, after that each new position moves the level
// LEVEL_K (15%) of the way toward its accuracy. So one bad position costs a little, a run of
// good ones lifts it steadily, and old results fade out. Not Elo: there's no win/lose, just how
// close you were — and no opponent rating, since every position is scored on the same scale.
const ACTS = ['analysis', 'candidates', 'final'];
const ACT_GLYPHS = { analysis:'⚖', candidates:'♘', final:'♔' };
const ACT_NAMES = { analysis:'Board analysis', candidates:'Candidate moves', final:'Final choice' };
const CALIBRATION = 5, LEVEL_K = 0.15, DAILY_GOAL = 5;
// Shown as "Average 71%"; changes are whole points of the shown value ("▲ 3%").
const pct = v => Math.round(v) + '%';
function deltaHtml(d){
  if(d==null) return '';
  return d===0 ? '<span>±0%</span>' : `<span class="${d>0 ? 'delta-up' : 'delta-down'}">${d>0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`;
}
let resultsDb = null;      // db collection when the database is available
let progressTab = 'analysis';
// This browser keeps a copy of the results too, so the home page can show the right routine and
// averages instantly on launch instead of starting empty while the database answers.
const LS_KEY = 'cst.results.v1';
function loadLocal(){ try{ const r = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return Array.isArray(r) ? r : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(results)); }catch(e){} }
const cached = loadLocal();
let results = cached || [];   // every recorded position, oldest first
// Without a copy in this browser (first launch here), the routine card's progress and the
// averages stay hidden until the database answers, then fade in — never an empty state first.
let progressLoaded = !!cached, progressJustLoaded = false;
function progressReady(){ if(!progressLoaded){ progressLoaded = true; progressJustLoaded = true; } }
// ---------- Profile: when you joined, and the missed positions ----------
// Missed positions: those whose latest play scored below your average for that exercise at the
// time (each result keeps its position and whether it was a miss), so the list is read from the
// results and follows them on every device. Playing one again at or above your average takes it off.
// legacyMissed: the list saved before results kept their position (read only).
const PROFILE_LS = 'cst.profile.v1', REPLAY_LS = 'cst.replay.v1';
let profile = { joinedAt:null }, legacyMissed = [], metaCol = null;
try{ const v = JSON.parse(localStorage.getItem(PROFILE_LS) || 'null'); if(v) profile = v; }catch(e){}
try{ const v = JSON.parse(localStorage.getItem(REPLAY_LS) || 'null'); if(Array.isArray(v)) legacyMissed = v; }catch(e){}
function missedList(){
  const last = new Map();   // 'a|key' -> that position's latest result in that exercise
  results.forEach(r=>{ if(r.key) last.set(r.a+'|'+r.key, r); });
  const out = legacyMissed.filter(x=>!last.has(x.a+'|'+x.key)).map(x=>({ key:x.key, a:x.a, ts:x.ts }));
  last.forEach(r=>{ if(r.miss) out.push({ key:r.key, a:r.a, ts:r.ts }); });
  return out;
}
function joinedAt(){ return Math.min(...[profile.joinedAt, results.length ? results[0].ts : null, Date.now()].filter(x=>x!=null)); }
function saveProfile(){ try{ localStorage.setItem(PROFILE_LS, JSON.stringify(profile)); }catch(e){} if(metaCol) metaCol.doc('profile').set(profile).catch(()=>{}); }
function findPosition(key, a){ return POOLS[a].find(p=>p.key===key) || myPositions.find(p=>p.key===key && p.acts.includes(a)) || null; }
// Missed positions still in the app; positions played today wait for tomorrow.
const missedOf = a=>missedList().filter(e=>e.a===a).map(e=>({ ...e, pos: findPosition(e.key, e.a) })).filter(e=>e.pos);
const replayable = a=>missedOf(a).filter(e=>!isPlayed(e.key));
function startReplay(a){
  replayQueue = replayable(a);
  if(!replayQueue.length) return;
  replayMode = true; routine = false; testMode = false; replayIdx = 0;
  openReplayAt(0);
}
function openReplayAt(i){
  const e = replayQueue[i], t = 'x-' + e.a;
  orders[t] = [e.pos]; seqBy[t] = 0; store[t] = {};
  delete poolShuffleCache['final' + t + e.pos.key];
  openActivity(e.a);
}
async function loadProfileMeta(db, id){
  const col = db.collection('data/users/' + id + '/trainer/meta');
  try{
    const [pd, rd] = await Promise.all([col.doc('profile').get(), col.doc('replay').get()]);
    const p = pd.exists ? pd.data() : null, r = rd.exists ? rd.data() : null;
    if(p && p.joinedAt) profile.joinedAt = profile.joinedAt ? Math.min(profile.joinedAt, p.joinedAt) : p.joinedAt;
    if(r && Array.isArray(r.items)) r.items.forEach(x=>{ if(!legacyMissed.some(y=>y.key===x.key && y.a===x.a)) legacyMissed.push(x); });
    metaCol = col;   // written to only after a successful read
  }catch(e){}
  if(!profile.joinedAt) profile.joinedAt = joinedAt();
  saveProfile();
}
async function initProgress(){
  try{
    const store = await getStore();
    if(store){
      const { db, id } = store;
      {
        const col = db.collection('data/users/' + id + '/trainer/results');
        // Every row, 1000 at a time (a query returns at most 1000).
        const fromDb = [];
        for(let after = -1;;){
          const snap = await col.where('ts', '>', after).orderBy('ts').limit(1000).get();
          const rows = snap.docs.map(d=>d.data());
          fromDb.push(...rows.filter(r=>r && ACTS.includes(r.a) && typeof r.acc==='number'));
          if(rows.length < 1000) break;
          after = rows[rows.length-1].ts;
        }
        // Anything played before the database answered is kept too.
        const pending = results.filter(r=>!fromDb.some(x=>x.ts===r.ts && x.a===r.a));
        results = fromDb.concat(pending).sort((x,y)=>x.ts-y.ts);
        resultsDb = col;
        pending.forEach(r=>col.add(r).catch(()=>{}));
        await loadProfileMeta(db, id);
        saveLocal(); progressReady(); render();
        return;
      }
    }
  }catch(e){ /* fall back to this browser */ }
  if(!profile.joinedAt){ profile.joinedAt = joinedAt(); saveProfile(); }
  progressReady(); render();
}
function levelSeries(a){
  let L = null;
  return results.filter(r=>r.a===a).map((r,i)=>{
    const k = Math.max(1/(i+1), LEVEL_K);
    L = L==null ? r.acc : L + k*(r.acc - L);
    return { ...r, level:L, n:i+1 };
  });
}
function levelNow(a){
  const sr = levelSeries(a), last = sr[sr.length-1];
  return { n: sr.length, level: last ? last.level : null, rated: sr.length >= CALIBRATION, series: sr };
}
// Records a finished position once (the review's state remembers it) and returns what the
// review shows: the level after this position and how much it moved.
function recordResult(s, a, acc){
  if(s.rec || acc==null) return;
  markPlayed(pos().key);
  if(testMode){ s.rec = { test:true }; return; }   // test positions never count
  const before = levelNow(a);
  // src: where the position came from (results before it existed: masters). miss: below your
  // average at the time, so the position is on your missed list until played well again.
  const r = { a, acc: Math.round(acc), ts: Date.now(), src: pos().gameId ? 'mine' : 'masters', key: pos().key, miss: before.level!=null && acc < before.level };
  results.push(r);
  if(resultsDb) resultsDb.add(r).catch(()=>{});
  saveLocal();
  const after = levelNow(a);
  s.rec = { n: after.n, level: after.level, delta: before.rated ? Math.round(after.level) - Math.round(before.level) : null, rated: after.rated };
}
// "Average 71% ▲ 3%" (or "3/5 to your average") in the review's score line, shown with the buttons.
function levelChip(s, show, fade){
  if(!s.rec) return '';
  const r = s.rec;
  const body = r.test ? 'Test position · not recorded' : !r.rated ? `${r.n}/${CALIBRATION} to your average`
    : `Average <strong>${pct(r.level)}</strong>` + (r.delta==null ? '' : ' ' + deltaHtml(r.delta));
  return `<span class="level${show ? (fade ? ' fade-in' : '') : ''}" style="${show ? '' : 'visibility:hidden'}">${body}</span>`;
}
const dayKey = ts=>{ const d = new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
// The daily routine: DAILY_GOAL positions of EACH exercise in the day, in as many sittings as
// you like. Done = all three reached; you can stop for the day, or keep training.
function todayBy(){ const k = dayKey(Date.now()), c = {analysis:0, candidates:0, final:0}; results.forEach(r=>{ if(dayKey(r.ts)===k) c[r.a]++; }); return c; }
// Data-driven parts of the home page: hidden until the results are known, faded in once.
function dataCls(){ return !progressLoaded ? ' data-wait' : progressJustLoaded ? ' fade-in' : ''; }
function routineCard(){
  const c = todayBy(), done = progressLoaded && ACTS.every(a=>c[a]>=DAILY_GOAL);
  const total = ACTS.reduce((t,a)=>t+Math.min(c[a], DAILY_GOAL), 0), started = total>0;
  const rn = routineFrom(routineNext);
  return `<div class="routine${done ? ' done' : ''}">
      <div class="routine-head"><span class="routine-title">Today's routine</span><span class="routine-count${dataCls()}">${done ? 'Done ✓' : `${total}/${DAILY_GOAL*3}`}</span></div>
      ${ACTS.map(a=>`<div class="routine-row"><span>${ACT_NAMES[a]}</span><span class="goal-dots${dataCls()}" aria-label="${Math.min(c[a],DAILY_GOAL)} of ${DAILY_GOAL}">${Array.from({length:DAILY_GOAL}, (_,i)=>`<i class="${i<c[a]?'on':''}"></i>`).join('')}</span></div>`).join('')}
      <button class="btn${done ? ' secondary' : ''} routine-btn" id="routineBtn" ${canOpen(rn, true) ? '' : 'disabled'}><span class="${dataCls().trim()}">${!canOpen(rn, true) ? waitText(rn, true) : done ? 'Keep training' : started ? 'Continue routine' : 'Start routine'}</span></button>
    </div>`;
}

// ================= Progress screen =================
let pfConfirmDelete = false;
function renderProgress(){
  const app = document.getElementById('app');
  const a = progressTab, info = levelNow(a), sr = info.series;
  const weekAgo = Date.now() - 7*864e5;
  const beforeWeek = sr.filter(r=>r.ts < weekAgo).pop();
  const weekDelta = info.rated && beforeWeek && beforeWeek.n >= CALIBRATION ? Math.round(info.level) - Math.round(beforeWeek.level) : null;
  const last10 = sr.slice(-10);
  const avg10 = last10.length ? Math.round(last10.reduce((t,r)=>t+r.acc,0)/last10.length) : null;
  const best = sr.filter(r=>r.n>=CALIBRATION).reduce((m,r)=>Math.max(m, r.level), -1);
  // This week: the last 7 days, today first.
  const days = Array.from({length:7}, (_,i)=>{ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); return d; });
  const byDay = {}; results.forEach(r=>{ const k = dayKey(r.ts); (byDay[k] = byDay[k] || {analysis:0, candidates:0, final:0})[r.a]++; });

// Level over the positions played (line) with each position's accuracy (faint dots), last 60.
const CH = { w:340, h:170, l:26, r:8, t:8, b:18 };
function chartX(i, n){ return CH.l + (n<=1 ? (CH.w-CH.l-CH.r)/2 : i*(CH.w-CH.l-CH.r)/(n-1)); }
function chartY(v){ return CH.t + (100-v)*(CH.h-CH.t-CH.b)/100; }
function levelChartSvg(sr){
  const pts = sr.slice(-60), n = pts.length;
  const grid = [0,25,50,75,100].map(v=>`<line x1="${CH.l}" x2="${CH.w-CH.r}" y1="${chartY(v)}" y2="${chartY(v)}" stroke="var(--border)" stroke-width="1"/><text x="${CH.l-6}" y="${chartY(v)+3.5}" text-anchor="end" font-size="10" fill="var(--text-mute)">${v}</text>`).join('');
  // Dots: grey for a master-game position, cyan for one of yours.
  const dots = pts.map((r,i)=>`<circle cx="${chartX(i,n)}" cy="${chartY(r.acc)}" r="2.6" fill="${r.src==='mine' ? 'var(--cyan-arrow)' : 'var(--text-mute)'}" opacity="${r.src==='mine' ? '.8' : '.55'}"/>`).join('');
  const line = pts.map((r,i)=>`${i?'L':'M'}${chartX(i,n).toFixed(1)},${chartY(r.level).toFixed(1)}`).join('');
  const first = sr.length - n + 1;
  return `<svg viewBox="0 0 ${CH.w} ${CH.h}" id="levelChart" role="img" aria-label="Average after each position">
      ${grid}${dots}
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${chartX(n-1,n)}" cy="${chartY(pts[n-1].level)}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
      <text x="${CH.l}" y="${CH.h-4}" font-size="10" fill="var(--text-mute)">#${first}</text>
      <text x="${CH.w-CH.r}" y="${CH.h-4}" font-size="10" fill="var(--text-mute)" text-anchor="end">#${sr.length}</text>
      <line id="chCross" x1="0" x2="0" y1="${CH.t}" y2="${CH.h-CH.b}" stroke="var(--text-mute)" stroke-width="1" opacity="0"/>
    </svg>`;
}
// Hover / tap: the nearest position's level and accuracy.
function wireChartHover(sr){
  const svg = document.getElementById('levelChart'), box = document.getElementById('chartBox');
  if(!svg) return;
  const pts = sr.slice(-60), n = pts.length, first = sr.length - n;
  let tip = null;
  const show = e=>{
    const rect = svg.getBoundingClientRect(), x = (e.clientX - rect.left) * CH.w / rect.width;
    const i = Math.max(0, Math.min(n-1, Math.round(n<=1 ? 0 : (x-CH.l)/((CH.w-CH.l-CH.r)/(n-1)))));
    const r = pts[i], cx = chartX(i,n), cross = document.getElementById('chCross');
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '.5');
    if(!tip){ tip = document.createElement('div'); tip.className = 'chart-tip'; box.appendChild(tip); }
    const bx = box.getBoundingClientRect();
    tip.style.left = Math.max(60, Math.min(bx.width-60, rect.left - bx.left + cx*rect.width/CH.w)) + 'px';
    tip.style.top = (rect.top - bx.top + chartY(Math.max(r.level, r.acc))*rect.height/CH.h - 8) + 'px';
    tip.innerHTML = `#${first+i+1} · ${new Date(r.ts).toLocaleDateString(undefined,{month:'short', day:'numeric'})}<br>Accuracy ${r.acc}% · Average ${r.n>=CALIBRATION ? pct(r.level) : '—'}`;
  };
  const hide = ()=>{ const c = document.getElementById('chCross'); if(c) c.setAttribute('opacity','0'); if(tip){ tip.remove(); tip = null; } };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

// --- Reading a Lichess PGN file ---
function pgnHeaders(g){ const h = {}; g.replace(/^\[(\w+)\s+"([^"]*)"\]\s*$/mg, (_, k, v)=>{ h[k] = v; return ''; }); return h; }
// Moves and their [%eval] comments (White's view: pawns, or #N for a mate). Variations skipped.
function pgnMovesAndEvals(g){
  const body = g.replace(/^\[.*\]\s*$/mg, '');
  const sans = [], evals = [];
  let i = 0, depth = 0;
  while(i < body.length){
    const ch = body[i];
    if(ch==='{'){
      const j = body.indexOf('}', i); const c = body.slice(i+1, j<0 ? body.length : j);
      const m = c.match(/\[%eval\s+(#?-?[\d.]+)/);
      if(m && depth===0 && sans.length){ const v = m[1]; evals[sans.length-1] = v[0]==='#' ? { mate:parseInt(v.slice(1),10) } : { cp:Math.round(parseFloat(v)*100) }; }
      i = j<0 ? body.length : j+1; continue;
    }
    if(ch==='('){ depth++; i++; continue; }
    if(ch===')'){ depth--; i++; continue; }
    if(/\s/.test(ch)){ i++; continue; }
    let j = i; while(j < body.length && !/[\s{}()]/.test(body[j])) j++;
    const tok = body.slice(i, j); i = j;
    if(depth>0) continue;
    const t = tok.replace(/^\d+\.+/, '').replace(/[!?]+$/, '');
    if(!t || /^\$\d+$/.test(t) || /^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)) continue;
    sans.push(t);
  }
  return { sans, evals:sans.map((_, k)=>evals[k] || null) };
}
function speedOf(h){
  const m = (h.Event || '').match(/\b(UltraBullet|Bullet|Blitz|Rapid|Classical|Correspondence)\b/i);
  if(m){ const w = m[1].toLowerCase(); return w==='ultrabullet' ? 'ultraBullet' : w; }
  const tc = h.TimeControl || '';
  if(!tc || tc==='-') return 'correspondence';
  const [base, inc] = tc.split('+').map(Number); const est = (base||0) + 40*(inc||0);
  return est < 30 ? 'ultraBullet' : est < 180 ? 'bullet' : est < 480 ? 'blitz' : est < 1500 ? 'rapid' : 'classical';
}
function gameIdOf(h, sans){
  const m = (h.Site || '').match(/lichess\.org\/(\w{8})/);
  if(m) return m[1];
  let x = 0; const str = (h.White||'')+(h.Black||'')+(h.Date||'')+sans.join(' ');
  for(let k=0; k<str.length; k++) x = (x*31 + str.charCodeAt(k)) | 0;
  return 'g' + (x>>>0).toString(36);
}

// ---- Log in with Lichess (website only) ----
// Lichess's own sign-in (OAuth 2 with PKCE): the page sends you to lichess.org, you approve, and
// Lichess sends you back with a one-time code that this page swaps for a token. No password ever
// reaches this site, no scope is asked (only your public profile and games), no server is involved.
// The token stays in this browser; "Log out" revokes it on Lichess.
const LICHESS = 'https://lichess.org', LICHESS_CLIENT_ID = 'chess-strategy-trainer';
const AUTH_LS = 'cst.lichessAuth', OAUTH_LS = 'cst.oauthPending';
let lichessAuth = null;   // { token, username }
try{ const v = JSON.parse(localStorage.getItem(AUTH_LS) || 'null'); if(v && v.token && v.username) lichessAuth = v; }catch(e){}

const b64url = bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const oauthRedirect = ()=>location.origin + location.pathname;
async function lichessLogin(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32))), state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  try{ localStorage.setItem(OAUTH_LS, JSON.stringify({ verifier, state })); }catch(e){}
  location.href = LICHESS + '/oauth?' + new URLSearchParams({ response_type:'code', client_id:LICHESS_CLIENT_ID,
    redirect_uri:oauthRedirect(), code_challenge_method:'S256', code_challenge:challenge, state });
}
function setLichessAuth(a){
  lichessAuth = a;
  try{ a ? localStorage.setItem(AUTH_LS, JSON.stringify(a)) : localStorage.removeItem(AUTH_LS); }catch(e){}
  if(a){ myName = a.username; try{ localStorage.setItem('cst.lichess', myName); }catch(e){} }

// Back from lichess.org: ?code=…&state=… (or ?error=… when you cancelled).
async function finishLichessLogin(){
  const q = new URLSearchParams(location.search);
  if(!q.has('code') && !q.has('error')) return;
  let pending = null;
  try{ pending = JSON.parse(localStorage.getItem(OAUTH_LS) || 'null'); localStorage.removeItem(OAUTH_LS); }catch(e){}
  history.replaceState(null, '', location.pathname + location.hash);   // the code is single-use: off the address bar
  screen = 'mygames';
  if(q.has('error') || !pending || q.get('state')!==pending.state){
    myImportNote = q.get('error')==='access_denied' ? 'Lichess login cancelled.' : "Lichess login didn't go through. Try again.";
    render(); return;
  }
  myImportNote = 'Logging in with Lichess…'; render();
  try{
    const tr = await fetch(LICHESS + '/api/token', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type:'authorization_code', code:q.get('code'), code_verifier:pending.verifier, redirect_uri:oauthRedirect(), client_id:LICHESS_CLIENT_ID }) });
    const tok = tr.ok ? await tr.json() : null;
    if(!tok || !tok.access_token) throw new Error('token');
    const ar = await fetch(LICHESS + '/api/account', { headers:{ Authorization:'Bearer ' + tok.access_token } });
    const acc = ar.ok ? await ar.json() : null;
    if(!acc || !acc.username) throw new Error('account');
    setLichessAuth({ token:tok.access_token, username:acc.username });
    myImportNote = '';
    fetchAfterLogin = true;   // no games yet (here or in your account): your games right away
  }catch(e){ myImportNote = "Lichess login didn't go through. Try again."; }
  render();
}

let syncStatus = '';   // 'ok', or why the account couldn't be reached (shown in the profile)
async function serverCall(auth, method, path, body){
  const headers = { Authorization:'Bearer ' + auth.token, 'X-Auth-Site':'lichess' };
  if(body!==undefined) headers['Content-Type'] = 'application/json';
  let r;
  try{ r = await fetch(API_BASE + path, { method, headers, body: body===undefined ? undefined : JSON.stringify(body) }); }
  catch(e){ throw new Error("couldn't reach the server"); }
  if(!r.ok){ let why = ''; try{ why = (await r.json()).error || ''; }catch(e){} throw new Error((why || 'error') + ' (' + r.status + ')'); }
  return r.json();
}

function serverDb(auth){
  const call = (m, p, b)=>serverCall(auth, m, p, b);
  const snap = list=>({ docs: list.map(x=>({ data: ()=>x })) });
  const queue = { results: [], games: new Map() }; let timer = null;
  const flush = ()=>{
    timer = null;
    const rs = queue.results.splice(0), gs = [...queue.games.values()]; queue.games.clear();
    const failed = e=>{ syncStatus = 'saving failed: ' + e.message; if(screen==='progress') render(); };   // sent again on the next launch
    for(let i=0; i<rs.length; i+=500) call('POST', '/api/results', { rows: rs.slice(i, i+500) }).catch(failed);
    for(let i=0; i<gs.length; i+=50) call('POST', '/api/games', { games: gs.slice(i, i+50) }).catch(failed);
  };
  const later = ()=>{ if(!timer) timer = setTimeout(flush, 400); };
  const meta = name=>({
    get: async()=>{ const r = await call('GET', '/api/meta/' + name); return { exists: r.exists, data: ()=>r.data }; },
    set: v=>call('PUT', '/api/meta/' + name, { data: v }),
  });
  const last = path=>path.split('/').pop();
  const resultsQuery = (after = -1, n = 1000)=>({
    where: (f, op, v)=>resultsQuery(v, n), orderBy: ()=>resultsQuery(after, n), limit: k=>resultsQuery(after, k),
    get: async()=>snap((await call('GET', `/api/results?after=${after}&limit=${n}`)).rows),
  });
  return {
    me: ()=>call('GET', '/api/me'),
    collection: path=>{
      const kind = last(path);
      if(kind==='results') return Object.assign(resultsQuery(), { add: async r=>{ queue.results.push(r); later(); } });
      if(kind==='games') return {
        limit: ()=>({ get: async()=>snap((await call('GET', '/api/games')).games) }),
        doc: id=>({ set: async g=>{ queue.games.set(g.id, g); later(); }, delete: ()=>call('DELETE', '/api/games/' + encodeURIComponent(id)) }),
      };
      return { doc: meta };   // meta documents
    },
    doc: path=>meta(last(path)),
    deleteAccount: ()=>call('DELETE', '/api/account'),
  };
}

async function fetchLichessGames(){

function importPgnText(text){
  const raw = text.split(/(?=\[Event )/).filter(g=>/\[White /.test(g));
  const parsed = raw.map(g=>({ h:pgnHeaders(g), ...pgnMovesAndEvals(g) }));
  // Whose games are these? The name you gave, else the name found in the most games.
  const count = {}, spelled = {};
  parsed.forEach(p=>[p.h.White, p.h.Black].forEach(n=>{ if(n){ count[n.toLowerCase()] = (count[n.toLowerCase()]||0) + 1; spelled[n.toLowerCase()] = n; } }));
  let me = myName.trim().toLowerCase();
  if(!me || !count[me]) me = Object.keys(count).sort((a,b)=>count[b]-count[a])[0] || '';
  const added = [], skipped = { other:0, variant:0, bullet:0, already:0, notMine:0 };
  let repaired = 0;
  for(const p of parsed){
    if(added.length >= OWN.maxGamesPerUpload) break;
    const h = p.h;
    if((h.Variant && h.Variant!=='Standard') || h.FEN || h.SetUp==='1'){ skipped.variant++; continue; }
    const speed = speedOf(h);
    if((speed==='bullet' || speed==='ultraBullet') && !includeBullet){ skipped.bullet++; continue; }
    const side = (h.White||'').toLowerCase()===me ? 'w' : (h.Black||'').toLowerCase()===me ? 'b' : null;
    if(!side){ skipped.notMine++; continue; }
    if(p.sans.length < 2*OWN.minMove){ skipped.other++; continue; }
    // Keep only the moves chess.js accepts (a broken move ends the game there). Strict reading
    // first: chess.js's lenient ("sloppy") reading takes a b-pawn capture like "bxc6" for a bishop
    // move and fails, which used to cut games short at their first b-pawn capture.
    const c = new Chess(); const sans = [];
    for(const s of p.sans){ const mv = c.move(s) || c.move(s, {sloppy:true}); if(!mv) break; sans.push(mv.san); }
    const id = gameIdOf(h, sans);
    const evals = p.evals.slice(0, sans.length);
    const old = myGames.find(g=>g.id===id);
    if(old && old.sans.length < sans.length && sans.slice(0, old.sans.length).join(' ')===old.sans.join(' ')){
      // A game saved cut short (see above): completed, keeping the engine checks already made.
      const full0 = evals.filter(Boolean).length >= sans.length - 1;
      old.sans = sans; old.evals = full0 ? evals : null; old.status = full0 ? 'evaluated' : 'queued'; delete old.verified;
      extractOwnPositions(old); saveMyGame(old); repaired++; continue;
    }
    if(old || added.some(g=>g.id===id)){ skipped.already++; continue; }
    const full = evals.filter(Boolean).length >= sans.length - 1;   // the last move may have none
    const g = { id, white:h.White||'?', black:h.Black||'?', me:side, year:(h.UTCDate||h.Date||'').slice(0,4), speed, result:h.Result||'*',
                sans, evals: full ? evals : null, status: full ? 'evaluated' : 'queued', positions:[], addedAt: Date.now(),
                site: /lichess\.org\//.test(h.Site || '') ? 'lichess' : 'file' };
    extractOwnPositions(g);   // Board analysis positions need no evaluation; likely mistakes are flagged if Lichess analysed the game
    added.push(g);
  }
  const meName = spelled[me] || me;
  if(me && !myName){ myName = meName; try{ localStorage.setItem('cst.lichess', meName); }catch(e){} }
  myGames = myGames.concat(added);
  added.forEach(saveMyGame);
  const parts = [];
  if(skipped.already) parts.push(`${skipped.already} already added`);
  if(skipped.bullet) parts.push(`${skipped.bullet} bullet`);
  if(skipped.variant) parts.push(`${skipped.variant} variant or from a set-up position`);
  if(skipped.notMine) parts.push(`${skipped.notMine} not played by ${spelled[me] || 'you'}`);
  if(skipped.other) parts.push(`${skipped.other} too short`);
  const fromLichess = added.filter(g=>g.status==='evaluated').length;
  myImportNote = raw.length && repaired && !added.length ? `Completed ${repaired} game${repaired===1?'':'s'} saved cut short earlier.`
    : raw.length ? `Added ${added.length} game${added.length===1?'':'s'} of ${meName}` +
    (added.length ? ` (${fromLichess} already analysed by Lichess)` : '') + (parts.length ? `. Skipped: ${parts.join(', ')}.` : '.')
    + (repaired ? ` Completed ${repaired} game${repaired===1?'':'s'} saved cut short earlier.` : '')
    : 'No games found in this file. Choose the .pgn file downloaded from Lichess.';
  onOwnPositionsChanged();
  myBackground();
}

// --- Finding positions in one game (needs an evaluation after every move) ---
function winForMover(e, turn){
  if(!e) return null;
  const s = turn==='w' ? 1 : -1;
  return e.mate!=null ? winPercent(null, s*e.mate) : winPercent(s*e.cp, null);
}
function extractOwnPositions(g){
  const c = new Chess(), fens = [c.fen()], hist = [];
  g.sans.forEach(s=>{ const mv = c.move(s); hist.push(mv); fens.push(c.fen()); });
  const title = `${g.white} – ${g.black}`, year = [g.year, SPEED_NAMES[g.speed]].filter(Boolean).join(' · ');
  const entry = (ply, acts, extra)=>{
    const m = hist[ply], prev = hist[ply-1], fen = fens[ply];
    return { key:'own:'+g.id+':'+ply, fen, side:fen.split(' ')[1], moveNo:+fen.split(' ')[5], title, year,
             last: prev ? [prev.from, prev.to] : null, hist:{ uci:m.from+m.to+(m.promotion||''), san:m.san, from:m.from, to:m.to },
             acts, gameId:g.id, ply, ...extra };
  };
  const div = divideGame(fens);
  const baFrom = div.mid>=0 ? div.mid : div.end, baLast = div.end>=0 ? div.end : hist.length-1, baTo = div.end>=0 ? div.end + OWN.retryPlies : baLast;   // middlegame and endgame starting together: from the endgame start
  const out = [], ba = [];
  // One pass over the game, every half-move checked once (early exits).
  for(let ply=0; ply<hist.length; ply++){
    const fen = fens[ply], turn = fen.split(' ')[1], moves = new Chess(fen).moves({verbose:true});
    // Your mistakes: every move of yours that lost 10+ points of winning chances, at any move
    // number. They go into both Candidate moves and Final choice (Final choice needs 4+ legal moves).
    // A move only counts once the app's engine has checked it (g.checks), unless the game's
    // evaluations are already full-strength (g.verified). A move the quick evaluations (Lichess's,
    // or the app's quick scan) flag as a likely mistake waits for that check ("pending").
    if(turn===g.me && moves.length >= OWN.candidatesMinLegal && ply>0){
      const checked = g.checks && g.checks[ply]!=null ? g.checks[ply] : null;
      const before = g.evals ? winForMover(g.evals[ply-1], turn) : null, after = g.evals ? winForMover(g.evals[ply], turn) : null;
      const quick = before!=null && after!=null ? before - after : null;
      const drop = checked!=null ? checked : g.verified ? quick : null;
      if(drop!=null && drop >= OWN.mistakeDrop){
        out.push(entry(ply, moves.length >= OWN.finalMinLegal ? ['candidates','final'] : ['candidates'], { drop: Math.round(drop) }));
        continue;   // a mistake position is never a Board analysis position
      }
      if(drop==null && quick!=null && quick >= OWN.flagDrop){ out.push(entry(ply, [], { pending:true })); continue; }
    }
    // Board analysis: middlegame start to endgame start, general rules, not in check, material within 3.
    if(baFrom<0 || ply<baFrom || ply>baTo) continue;
    const moveNo = +fen.split(' ')[5];
    if(moveNo < OWN.minMove || moveNo > OWN.maxMove || moves.length < OWN.minLegal) continue;
    const prev = hist[ply-1]; if(prev && prev.captured && moves.some(m=>m.to===prev.to && m.captured)) continue;
    const pc = new Chess(fen); if(pc.in_check() || Math.abs(materialDiff(pc)) > OWN.maxMaterialDiff) continue;
    ba.push(ply);
  }
  // Board analysis: the middlegame and endgame starts first (or up to 3 half-moves later), then
  // positions 7 half-moves from those already kept, in move order.
  const kept = [];
  const take = ply=>{ if(kept.some(k=>Math.abs(k-ply) < OWN.spacingPlies)) return; kept.push(ply); };
  for(const start of [div.mid, div.end]){ if(start<0) continue; const a = ba.find(p=>p>=start && p<=start+OWN.retryPlies); if(a!=null) take(a); }
  ba.filter(p=>p<=baLast).forEach(take);
  kept.sort((a,b)=>a-b).forEach(ply=>out.push(entry(ply, ['analysis'])));
  g.positions = out;
}
// Lichess's game phases (scalachess Divider, MIT licence: see THIRD_PARTY.md in the source), as in the position finder.
const PIECE_VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };
function piecesOf(ch){ const out = []; ch.board().forEach((row,ri)=>row.forEach((c,fi)=>{ if(c) out.push({ ...c, file:fi, rank:7-ri }); })); return out; }
function materialDiff(ch){ return piecesOf(ch).reduce((t,p)=>t + (p.color==='w' ? 1 : -1)*PIECE_VAL[p.type], 0); }
function divideGame(fens){
  const mm = ps=>ps.filter(p=>p.type!=='k' && p.type!=='p').length;
  const sparse = ps=>ps.filter(p=>p.color==='w' && p.rank===0).length < 4 || ps.filter(p=>p.color==='b' && p.rank===7).length < 4;
  const score = (y, w, b)=>{
    switch(w){
      case 0: switch(b){ case 1: return 1+y; case 2: return y<6 ? 2+(6-y) : 0; case 3: case 4: return y<7 ? 3+(7-y) : 0; default: return 0; }
      case 1: switch(b){ case 0: return 1+(8-y); case 1: return 5+Math.abs(4-y); case 2: return 4+(7-y); case 3: return 5+(7-y); default: return 0; }
      case 2: switch(b){ case 0: return y>2 ? 2+(y-2) : 0; case 1: return 4+(y-1); case 2: return 7; default: return 0; }
      case 3: switch(b){ case 0: return y>1 ? 3+(y-1) : 0; case 1: return 5+(y-1); default: return 0; }
      case 4: switch(b){ case 0: return y>1 ? 3+(y-1) : 0; default: return 0; }
      default: return 0;
    }
  };
  const mixed = ps=>{
    let acc = 0;
    for(let y=0; y<7; y++) for(let x=0; x<7; x++){
      const inR = p=>p.file>=x && p.file<=x+1 && p.rank>=y && p.rank<=y+1;
      acc += score(y+1, ps.filter(p=>p.color==='w' && inR(p)).length, ps.filter(p=>p.color==='b' && inR(p)).length);
    }
    return acc;
  };
  const ps = fens.map(f=>piecesOf(new Chess(f)));
  const mid = ps.findIndex(p=>mm(p) <= 10 || sparse(p) || mixed(p) > 150);
  const end = mid>=0 ? ps.findIndex(p=>mm(p) <= 6) : -1;
  return { mid: mid>=0 && (end<0 || mid<end) ? mid : -1, end };
}

// --- Background work: scan the games Lichess hasn't analysed ---
function onOwnPositionsChanged(){
  myPositions = myGames.flatMap(g=>(g.positions||[]).filter(p=>Array.isArray(p.acts)))
    .map(p=>({ ...p, last: p.last ? { squares:p.last } : null }));
  refreshPools();
  if(screen==='mygames' || screen==='home') render();
  else if(ACTIVITIES.includes(screen) && curPos && st(screen).checked){ const n = document.getElementById('nextPos'); if(n && n.disabled) render(); }
}
let myBgRunning = false;
// Order of work, so the pools grow fast: first check the likely mistakes already flagged (games
// Lichess analysed come with their flags at once); only then quick-scan a game Lichess didn't
// analyse, which flags its likely mistakes for checking in turn.
const myTried = new Set();   // likely mistakes already checked in this session: never checked twice
const currentGame = id=>myGames.find(x=>x.id===id);   // games can be reloaded meanwhile: always write to the current copy
async function myBackground(){
  if(myBgRunning || sfState!=='ready' || !myGamesLoaded) return;
  myBgRunning = true;
  let retry = false;
  try{
    while(sfState==='ready'){
      const g1 = myGames.find(x=>(x.positions||[]).some(p=>p.pending && !myTried.has(p.key)));
      if(g1){
        const p = g1.positions.find(x=>x.pending && !myTried.has(x.key));
        myTried.add(p.key);
        let drop = null;
        try{ drop = await checkMistake(p); }
        catch(e){ drop = 0; }   // a position that can't be checked is left out
        if(drop==null){ myTried.delete(p.key); retry = true; break; }
        const g = currentGame(g1.id); if(!g) continue;
        (g.checks = g.checks || {})[p.ply] = drop;
        extractOwnPositions(g); saveMyGame(g); onOwnPositionsChanged(); continue;
      }
      const g2 = myGames.find(x=>x.status==='queued' && !myTried.has('scan:'+x.id));
      if(!g2) break;
      myTried.add('scan:'+g2.id);
      myScanning = g2.id; if(screen==='mygames') render();
      let evals = null, failed = false;
      try{ evals = await scanOwnGame(g2); }
      catch(e){ failed = true; }
      myScanning = null;
      if(!evals && !failed){ myTried.delete('scan:'+g2.id); retry = true; break; }
      const g = currentGame(g2.id); if(!g) continue;
      if(evals){ g.evals = evals; g.status = 'evaluated'; } else g.status = 'failed';
      extractOwnPositions(g); saveMyGame(g); onOwnPositionsChanged();
    }
  } finally {
    myBgRunning = false; myScanning = null;
    if(screen==='mygames') render();
    if(retry) setTimeout(myBackground, 5000);   // the engine was briefly unavailable: try again
  }
}
// The check of one likely mistake: the app's usual search of the position (top 5), and your move
// judged in the same search as the top 5. Kept for the exercises, which then open without waiting.
async function checkMistake(p){
  const disc = await bgEval(p.fen, { multipv:DISCOVERY_MULTIPV, movetime:OWN.checkMs });
  if(evalFailed(disc) || !disc.lines.length) return null;
  if(!fenEvalStore[p.fen]) fenEvalStore[p.fen] = { status:'done', data:disc };
  let lines = disc.lines, gm = lines.find(l=>l.uci===p.hist.uci);
  if(!gm){
    const both = await bgEval(p.fen, { searchmoves: lines.slice(0,5).map(l=>l.uci).concat(p.hist.uci).join(' ') });
    if(evalFailed(both) || !both.lines.length) return null;
    lines = both.lines; gm = lines.find(l=>l.uci===p.hist.uci);
  }
  const drop = gm ? winPercent(lines[0].cp, lines[0].mate) - winPercent(gm.cp, gm.mate) : 0;
  return Math.round(drop*10)/10;
}
// One quick search before and after each of your moves, for a game Lichess hasn't analysed:
// enough to spot a move that lost 10+ points of winning chances.
async function scanOwnGame(g){
  const c = new Chess(), fens = [c.fen()];
  g.sans.forEach(s=>{ c.move(s); fens.push(c.fen()); });
  const need = new Set();
  for(let ply=1; ply<g.sans.length; ply++) if(fens[ply].split(' ')[1]===g.me){ need.add(ply); need.add(ply+1); }
  const evals = new Array(g.sans.length).fill(null);
  for(const k of need){
    if(k >= fens.length) continue;
    const pc = new Chess(fens[k]);
    if(pc.game_over()){ evals[k-1] = pc.in_checkmate() ? { mate: pc.turn()==='w' ? -1 : 1 } : { cp:0 }; continue; }   // mated, or a draw
    const r = await bgEval(fens[k], { multipv:1, movetime:OWN.scanMs });
    if(evalFailed(r) || !r.lines.length) return null;
    const l = r.lines[0], sgn = fens[k].split(' ')[1]==='w' ? 1 : -1;
    evals[k-1] = l.mate!=null ? { mate:sgn*l.mate } : { cp:sgn*l.cp };
  }
  return evals;
}

// The "My games" page: add games, see what was found, next to the master games' figures.
function lichessExportUrl(name){

}
function countsOf(list){ const c = { analysis:0, candidates:0, final:0 }; list.forEach(p=>(p.acts||[]).forEach(a=>{ if(c[a]!=null) c[a]++; })); return c; }

// ================= Board analysis =================
// The reveal: once the engine's number is in, the bar and its score slide from your guess to
// the engine's value while the accuracy counts down from 100%; the recap and buttons appear
// when it lands. `s.animT` (0→1) is the progress, so a re-render mid-way just redraws the
// current frame instead of restarting.
const REVEAL_MS = 1400;
const easeOut = t=>1-Math.pow(1-t, 3);
function renderAnalysis(){
  const app = document.getElementById('app');
  const p = pos(), s = st('analysis');
  const disc = s.checked ? fenEval(p.fen) : null;
  const failed = evalFailed(disc);
  const truth = s.checked && !failed ? positionInfo(p, disc) : null;
  if(truth && s.animT==null){ recordResult(s, 'analysis', evalAccuracyPct(s.guess, truth.pct)); startReveal(p, s, truth); prefetchNext(); }
  const t = truth ? easeOut(s.animT ?? 1) : 0;
  const done = !!truth && (s.animT ?? 1) >= 1;
  const acc = truth ? evalAccuracyPct(s.guess, truth.pct) : null;
  const barPct = truth ? s.guess + (truth.pct - s.guess)*t : s.guess;
  const bar = s.checked
    ? evalBarHtml(barPct, done ? fmtBarScore(truth.info) : truth ? fmtGuess(barPct) : '…', s.guess, false)
    : evalBarHtml(s.guess, fmtGuess(s.guess), s.guess, true);
  app.innerHTML = `
    ${header('Board analysis')}
    ${posBar()}
    ${boardHtml(true, bar)}
    ${stackedPanel(`
      ${s.checked ? `
        <div class="score"><span class="score-num" id="revealAcc">${truth ? Math.round(100 + (acc-100)*t)+'%' : '—'}</span><span class="score-label">${truth ? 'accuracy' : failed ? 'evaluation unavailable' : 'evaluating…'}</span>${levelChip(s, done, s.justDone)}</div>
        ${done ? `<p class="recap${s.justDone ? ' fade-in' : ''}">${analysisRecap(s.guess, truth.pct)}</p>`
               : `<p class="recap">&nbsp;</p>`}
        <div class="actions-row split${done ? (s.justDone ? ' fade-in' : '') : failed ? '' : ' pending'}">${lichessLink(p)}<button class="btn" id="nextPos">${nextLabel()}</button></div>`
      : `
        <p class="prompt" id="anaPrompt">Set the bar where you think the evaluation stands.</p>
        <div class="actions-row" id="anaCheckRow"><button class="btn" id="check">Check</button></div>`}`, GHOST_ANALYSIS, engineErrorBanner())}`;
  renderBoard(document.getElementById('board'), boardObjFromGame(new Chess(p.fen)), p.last);
  if(!s.checked){
    setupGauge(s);
    introFade(s, ['anaPrompt', 'anaCheckRow']);
    document.getElementById('check').onclick = ()=>{ s.checked = true; s.animT = null; s.justDone = false; fenEval(p.fen); render(); };
  }
  wireCommon('analysis', s.checked);
  s.justDone = false;   // the recap/buttons fade plays once, when the reveal lands — not on later redraws
}
function startReveal(p, s, truth){
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ s.animT = 1; return; }
  s.animT = 0;
  const key = p.key, acc = evalAccuracyPct(s.guess, truth.pct);
  let start = null;
  const step = ts=>{
    if(start===null) start = ts;
    s.animT = Math.min(1, (ts-start)/REVEAL_MS);
    // Left the screen or moved on mid-reveal: just finish it silently.
    if(screen!=='analysis' || pos().key!==key){ s.animT = 1; return; }
    const t = easeOut(s.animT), pct = s.guess + (truth.pct - s.guess)*t;
    const w = document.getElementById('barWhite'), b = document.getElementById('barBlack'),
          n = document.getElementById('barNum'), a = document.getElementById('revealAcc');
    if(w){ w.style.height = pct+'%'; b.style.height = (100-pct)+'%'; }
    if(n){ n.textContent = fmtGuess(pct); n.setAttribute('style', barNumStyle(pct)); }
    if(a) a.textContent = Math.round(100 + (acc-100)*t)+'%';
    if(s.animT<1) requestAnimationFrame(step); else { s.justDone = true; render(); }
  };
  requestAnimationFrame(step);
}
let gaugeState = null, gaugeDragging = false;
function setupGauge(s){
  const bar = document.getElementById('evalBar');
  const update = pct=>{
    s.guess = Math.max(1, Math.min(99, pct));
    const w = document.getElementById('barWhite'), b = document.getElementById('barBlack'), c = document.getElementById('barCursor'),
          n = document.getElementById('barNum');
    if(!w) return;
    w.style.height = s.guess+'%'; b.style.height = (100-s.guess)+'%';
    c.style[boardFlipped() ? 'top' : 'bottom'] = s.guess+'%';
    n.textContent = fmtGuess(s.guess);
    n.setAttribute('style', barNumStyle(s.guess));
    bar.setAttribute('aria-valuenow', Math.round(s.guess));
    bar.setAttribute('aria-valuetext', fmtGuess(s.guess));
  };
  gaugeState = { bar, update };
  update(s.guess);
  bar.parentElement.addEventListener('pointerdown', e=>{ gaugeDragging = true; update(gaugePos(e)); e.preventDefault(); });
  bar.addEventListener('keydown', e=>{
    const step = e.shiftKey ? 10 : 2;
    const up = boardFlipped() ? -step : step; // "up" on screen = more of whatever is at the bottom's opposite
    if(e.key==='ArrowUp'){ update(s.guess + up); e.preventDefault(); }
    if(e.key==='ArrowDown'){ update(s.guess - up); e.preventDefault(); }
  });
}
// White's share from the pointer's height on the bar: bottom = 100% White when White is at the
// bottom; the reverse when the board (and bar) are flipped.
function gaugePos(e){
  const rect = gaugeState.bar.getBoundingClientRect();
  const fromTop = (e.clientY - rect.top) / rect.height * 100;
  return boardFlipped() ? fromTop : 100 - fromTop;
}
// Registered once: the bar is rebuilt on every render, the window listeners aren't.
window.addEventListener('pointermove', e=>{ if(gaugeDragging && gaugeState) gaugeState.update(gaugePos(e)); });
window.addEventListener('pointerup', ()=>{ gaugeDragging = false; });

// ================= Candidate moves =================
function pickHint(count){
  const who = side==='w' ? 'White' : 'Black';
  if(count===0) return `Tap a ${who.toLowerCase()} piece, then its destination. Suggest at least one strong move for ${who}.`;
  if(count===1) return 'You can add up to three moves.';
  if(count===2) return 'Any last move worth considering?';
  return '';
}
function renderCandidates(){
  const app = document.getElementById('app');
  const p = pos(), s = st('candidates');
  const chess = new Chess(p.fen);
  const bs = boardObjFromGame(chess);

  if(s.checked){
    // Everything below reads the one combined search (picks + game move + engine top 5).
    const ev0 = candidatesEval(p, s.picks);
    const failed = evalFailed(ev0), ev = failed ? null : ev0;
    // List 1: the player's own picks. A pick the engine didn't return a line for shows "—".
    let mine = s.picks.map((m,i)=>({ ...m, num:String(i+1), color:cols[m.slot] }));
    mine.forEach(r=>{ r.outcome = moveOutcome(p.fen, r.uci, ev); r.na = (!!ev || failed) && !r.outcome; });
    // Once the evaluation is in, your moves are re-ordered best → worst (animated once, below).
    const canSort = !!ev;
    if(canSort && s.sortDone){
      mine = mine.slice().sort((a,b)=>pickSortKey(b) - pickSortKey(a)).map((r,i)=>({ ...r, num:String(i+1) }));
    }
    // List 2: the engine's top N, N = how many moves the player picked (the same reference the
    // accuracy uses). Anything already Dubious or worse (10+ win% points behind the best) is
    // greyed out: it's in the list only because there aren't that many good moves.
    let nextTop = 0;
    const topN = Math.max(1, s.picks.length);
    const top = ev ? ev.lines.slice(0,topN).filter(l=>l.uci).map((l,i)=>{
      const u = l.uci, from = u.slice(0,2), to = u.slice(2,4);
      const picked = s.picks.find(m=>m.uci===u);
      const r = { uci:u, from, to, san:sanForUci(p.fen, u), num:String(i+1) };
      r.outcome = moveOutcome(p.fen, u, ev);
      r.muted = !!(r.outcome && r.outcome.winDrop>=10);
      // A move you picked keeps your colour in this list too; the others take the engine colours.
      r.color = r.muted ? 'var(--text-mute)' : picked ? cols[picked.slot] : TOP_COLS[nextTop++];
      return r;
    }) : [];
    const acc = pickAccuracyPct(s.picks, ev);
    // Both lists are always shown; the two headers only switch each list's arrows on the board.
    // By default only your own moves are drawn, so the board doesn't start out crowded.
    const showMine = s.showMine!==false, showTop = !!s.showTop;
    const arrowList = [];
    [...(showMine ? mine : []), ...(showTop ? top : [])].forEach(m=>{
      if(!arrowList.some(a=>a.uci===m.uci)) arrowList.push(m);
    });
    const col = (title, key, on, rows, emptyText)=>`
      <div class="review-col">
        <button class="col-toggle ${on?'on':''}" data-toggle="${key}" aria-pressed="${on}">
          <span class="col-toggle-box" aria-hidden="true"></span>${title}
        </button>
        ${rows.length ? rows.map(r=>miniRowHtml(r, !!s.sortDone, !!s.justSorted)).join('') : `<p class="hint">${emptyText}</p>`}
      </div>`;
    app.innerHTML = `
      ${header('Candidate moves')}
      ${posBar()}
      ${boardHtml(false)}
      ${stackedPanel(`
        <div class="score"><span class="score-num" id="candAcc">${s.countDone ? pctOrDash(acc) : s.countStarted ? '0%' : '—'}</span><span class="score-label" id="candAccLabel">${failed ? 'evaluation unavailable' : s.countStarted || s.countDone ? 'accuracy' : 'evaluating…'}</span>${levelChip(s, s.countDone, s.justCounted)}</div>
        <div class="review-cols">
          ${col('Your moves', 'mine', showMine, mine, '')}
          ${col('Top moves', 'top', showTop, top, failed ? 'Unavailable' : 'Evaluating…')}
        </div>
        <div class="actions-row split${s.countDone ? (s.justCounted ? ' fade-in' : '') : failed ? '' : ' pending'}">${lichessLink(p)}<button class="btn" id="nextPos">${nextLabel()}</button></div>`,
        ghostCandidates(), engineErrorBanner())}`;
    renderBoard(document.getElementById('board'), bs, p.last);
    drawArrows(document.getElementById('arrows'), arrowList, 'ac_');
    document.querySelectorAll('.col-toggle').forEach(b=>b.onclick = ()=>{
      if(b.dataset.toggle==='mine') s.showMine = !showMine; else s.showTop = !showTop;
      render();
    });
    wireCommon('candidates', true);
    // "Top moves" fade in together (no slide) once the evaluation is in, while your moves re-order.
    if(top.length && s.topAt==null){ s.topAt = performance.now(); prefetchNext(); }
    if(s.topAt!=null){
      const el = performance.now() - s.topAt;
      document.querySelectorAll('.review-col')[1]?.querySelectorAll('.mini-row')
        .forEach(r=>timedFade(r, 30, el, TOP_FADE, 'rowIn', SORT_EASE));   // same start, length and curve as the re-order
      // ...and the grades + scores of your own moves fade in with them, all at once.
      document.querySelectorAll('.review-col')[0]?.querySelectorAll('.mini-result')
        .forEach(r=>timedFade(r, 30, el, TOP_FADE, 'rowIn', SORT_EASE));
    }
    s.justSorted = false; s.justCounted = false;
    if(canSort && !s.sortStarted){ s.sortStarted = true; recordResult(s, 'candidates', acc); animateSort(s, mine, acc); }
    return;
  }

  const capReached = s.picks.length>=3;
  const destSquares = selSquare
    ? (capReached ? s.picks.filter(m=>m.from===selSquare).map(m=>m.to)
                  : chess.moves({square:selSquare, verbose:true}).map(m=>m.to))
    : [];
  app.innerHTML = `
    ${header('Candidate moves')}
    ${posBar()}
    ${boardHtml(false)}
    ${stackedPanel(`
      <div id="moveList"></div>
      ${pickHint(s.picks.length) ? `<p class="hint" id="candHint">${pickHint(s.picks.length)}</p>` : ''}
      <div class="actions-row" id="candCheckRow"><button class="btn" id="check" ${s.picks.length ? '' : 'disabled'}>Check</button></div>`,
      ghostCandidates(), engineErrorBanner())}`;
  const canSelect = sq=>{
    const piece = bs[sq];
    if(!piece || colorOf(piece)!==side) return false;
    return !capReached || s.picks.some(m=>m.from===sq);
  };
  const freeSlot = ()=>{ for(let k=0;k<3;k++){ if(!s.picks.some(m=>m.slot===k)) return k; } return 0; };
  const addPick = mv=>{
    const uci = mv.from+mv.to+(mv.promotion||'');
    const dup = s.picks.findIndex(m=>m.uci===uci);
    if(dup>=0){ s.picks.splice(dup,1); return; }
    if(s.picks.length<3) s.picks.push({ id:'c_'+uci, san:mv.san, from:mv.from, to:mv.to, uci, slot:freeSlot() });
  };
  renderBoard(document.getElementById('board'), bs, p.last, {
    selectedSq: selSquare, destSquares,
    onSquareClick: sq=>{
      if(selSquare && destSquares.includes(sq)){
        const legal = chess.moves({square:selSquare, verbose:true}).filter(m=>m.to===sq);
        if(legal.some(m=>m.promotion) && !capReached){
          promoPending = { from:selSquare, to:sq };   // ask which piece (below)
        } else {
          const dup = s.picks.findIndex(m=>m.from===selSquare && m.to===sq && (capReached || m.uci===selSquare+sq));
          if(dup>=0) s.picks.splice(dup,1);
          else if(legal[0]) addPick(legal[0]);
        }
        selSquare = null; render(); return;
      }
      selSquare = canSelect(sq) && sq!==selSquare ? sq : null;
      render();
    }
  });
  drawArrows(document.getElementById('arrows'), s.picks.map(m=>({ ...m, color:cols[m.slot] })), 'ap_');
  if(promoPending) showPromotionPicker(chess, addPick);
  const listEl = document.getElementById('moveList');
  s.picks.forEach((m,i)=>{
    const row = document.createElement('div');
    row.className = 'review-row pick-row';
    row.innerHTML = `<div class="move-tag"><span class="num">${i+1}</span><span class="move-chip" style="background:${cols[m.slot]}">${m.san}</span></div>`;
    const rm = document.createElement('button');
    rm.className = 'del-btn'; rm.textContent = '✕';
    rm.setAttribute('aria-label', 'Remove ' + m.san);
    rm.onclick = ()=>{ s.picks.splice(i,1); render(); };
    row.appendChild(rm);
    listEl.appendChild(row);
  });
  introFade(s, ['candHint', 'candCheckRow']);
  document.getElementById('check').onclick = ()=>{ s.checked = true; s.sortDone = false; s.countStarted = false; s.countDone = false; s.sortStarted = false; s.topAt = null; selSquare = null; candidatesEval(p, s.picks); render(); };
  wireCommon('candidates', false);
}

// The review's reveal, once the evaluation is in — one step at a time:
//   1. "Your moves" slide into best → worst order, like a drag-and-drop (moving rows lift, same
//      look as a dragged row in Final choice);
//   2. the list is redrawn in its new order and the Best highlight fades in;
//   3. the accuracy counts up from 0% to the final value;
//   4. the buttons fade in.
// Runs once per review; with reduced motion everything shows at once.
const TOP_FADE = 550, SORT_EASE = 'cubic-bezier(.2,.8,.2,1)';
const SORT_MOVE = 650, BEAT = 350, COUNT_MS = REVEAL_MS;   // same pace as the board-analysis reveal
const pickSortKey = r => r.outcome ? r.outcome.moverCp : -Infinity;
function animateSort(s, mine, acc){
  const order = mine.slice().sort((a,b)=>pickSortKey(b) - pickSortKey(a)).map(r=>r.uci);
  const unchanged = order.every((k,i)=>k===mine[i].uci);
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const key = pos().key;
  const here = ()=> screen==='candidates' && pos().key===key;
  if(reduced || acc==null){ s.sortDone = s.countStarted = s.countDone = true; if(here()) render(); return; }

  const countUp = ()=>{
    // "evaluating…" stays up until this point — the count is the first sign of the score.
    s.countStarted = true;
    const label = document.getElementById('candAccLabel'), num = document.getElementById('candAcc');
    if(here() && label){ label.textContent = 'accuracy'; num.textContent = '0%'; }
    let start = null;
    const step = ts=>{
      if(start===null) start = ts;
      const t = Math.min(1, (ts-start)/COUNT_MS);
      const el = document.getElementById('candAcc');
      if(el && here()) el.textContent = Math.round(acc * easeOut(t)) + '%';
      if(t<1) requestAnimationFrame(step);
      else { s.countDone = true; s.justCounted = true; if(here()) render(); }   // 4. buttons
    };
    requestAnimationFrame(step);
  };
  const afterSort = ()=>{
    s.sortDone = true; s.justSorted = true; s.countStarted = true;             // 2. order + Best
    if(here()) render();
    countUp();                                                                  // 3. accuracy, alongside the highlight
  };
  // Already in order: still wait the length of a re-order, so the Top moves fade has finished
  // before the Best highlight starts (both animate the same row when your best is the top move).
  if(unchanged){ setTimeout(afterSort, SORT_MOVE); return; }

  const col = document.querySelector('.review-col');
  const rows = col ? Array.from(col.querySelectorAll('.mini-row')) : [];
  if(rows.length!==mine.length){ afterSort(); return; }
  const tops = rows.map(r=>r.offsetTop);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{                         // 1. reorder, right away
    rows.forEach(r=>{
      const target = order.indexOf(r.dataset.key), current = rows.indexOf(r);
      if(target===current) return;
      r.classList.add('sorting');
      r.style.transform = `translateY(${tops[target]-tops[current]}px)`;
    });
    setTimeout(afterSort, SORT_MOVE);
  }));
}

// ================= Final choice =================
// Timed fade for one element: starts `delay` ms after a sequence began, `elapsed` ms ago. Done by
// elapsed time rather than on first paint, so a re-render mid-sequence carries on where it was.
// `kind` is rowIn (plain fade) or fadeIn (fade with a small rise).
function timedFade(el, delay, elapsed, dur, kind, easing){
  if(!el || elapsed >= delay + dur) return;
  el.style.animation = `${kind} ${dur}ms ${easing || 'ease-out'} ${delay - elapsed}ms both`;
  // Only this element's own animation ending counts — a child's animationend bubbles up too.
  const done = ev=>{ if(ev.target!==el) return; el.style.animation = ''; el.removeEventListener('animationend', done); };
  el.addEventListener('animationend', done);
}
const SLIDE_MS = 350;   // = .fade-in, the Board analysis recap/buttons fade-and-rise
// Question screens of Board analysis and Candidate moves: the instruction and Check button fade
// and rise in together, once per position, as soon as the screen opens.
function introFade(s, ids){
  if(s.introAt==null) s.introAt = performance.now();
  const el = performance.now() - s.introAt;
  ids.forEach(id=>timedFade(document.getElementById(id), 0, el, SLIDE_MS, 'fadeIn'));
}
const INTRO_START = 400, INTRO_STEP = 450, INTRO_FADE = 650;
const REV_START = INTRO_START, REV_STEP = INTRO_STEP, REV_FADE = INTRO_FADE;   // same pace as the moves' intro
function renderFinal(){
  const app = document.getElementById('app');
  const p = pos(), s = st('final');
  const moves = finalMoves(p);
  const bs = boardObjFromGame(new Chess(p.fen));
  if(!moves || evalFailed(moves)){
    // Waiting for the engine's top moves — or no engine at all, in which case there's nothing to
    // rank and the only way on is the next position.
    const none = evalFailed(moves);
    app.innerHTML = `
      ${header('Final choice')}
      ${posBar()}
      ${boardHtml(false)}
      ${stackedPanel(`<p class="hint" style="margin:0">${none ? 'No moves to rank: the position couldn\'t be evaluated.' : 'Preparing four candidate moves…'}</p>
        ${none ? `<div class="actions-row split">${lichessLink(p)}<button class="btn" id="nextPos">${nextLabel()}</button></div>` : ''}`, ghostFinal(), engineErrorBanner())}`;
    renderBoard(document.getElementById('board'), bs, p.last);
    wireCommon('final', false);
    return;
  }
  // The four moves are known: start their one evaluation now, while the player ranks them.
  const ev0 = finalEval(p, moves);
  const failed = evalFailed(ev0), ev = failed ? null : ev0;
  if(!s.order || s.order.length!==moves.length || !moves.every(m=>s.order.includes(m.id))) s.order = moves.map(m=>m.id);
  const ordered = s.order.map(id=>moves.find(m=>m.id===id));

  if(s.checked){
    const rows = ordered.map((m,i)=>({ ...m, num:String(i+1), outcome: moveOutcome(p.fen, m.uci, ev) }));
    rows.forEach(r=>{ r.na = (!!ev || failed) && !r.outcome; });
    const cpById = {};
    rows.forEach(r=>{ cpById[r.id] = r.outcome ? r.outcome.moverCp : null; });
    const acc = ev ? rankAccuracyPct(s.order, cpById) : null;
    // The reveal, timed from when the evaluation is in (so re-renders pick it up mid-way):
    //   1. each move's grade + score (and the Best highlight, on its row) fades in, row 1 to 4;
    //   2. then the accuracy counts up from 0%;
    //   3. the buttons fade and slide in.
    const ready = !!ev;
    if(ready && s.revAt==null){
      s.revAt = performance.now();
      recordResult(s, 'final', acc);
      prefetchNext();
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) s.revAt -= 1e6;
    }
    const e = s.revAt==null ? -1 : performance.now() - s.revAt;
    const tCount = REV_START + (rows.length-1)*REV_STEP + REV_FADE, tEnd = tCount + COUNT_MS;
    if(e >= tEnd && !s.revDone){ s.revDone = true; s.justDone = true; }
    const counting = e >= tCount;
    const scoreText = !counting ? '—' : s.revDone ? pctOrDash(acc) : Math.round(acc * easeOut((e - tCount)/COUNT_MS)) + '%';
    app.innerHTML = `
      ${header('Final choice')}
      ${posBar()}
      ${boardHtml(false)}
      ${stackedPanel(`
        <div class="score"><span class="score-num" id="finalAcc">${scoreText}</span><span class="score-label" id="finalAccLabel">${failed ? 'evaluation unavailable' : counting ? 'accuracy' : 'evaluating…'}</span>${levelChip(s, s.revDone, s.justDone)}</div>
        <div id="reviewRows" class="rev-list">${rows.map(reviewRowHtml).join('')}</div>
        <div class="actions-row split${s.revDone ? (s.justDone ? ' fade-in' : '') : failed ? '' : ' pending'}">${lichessLink(p)}<button class="btn" id="nextPos">${nextLabel()}</button></div>`, ghostFinal(), engineErrorBanner())}`;
    renderBoard(document.getElementById('board'), bs, p.last);
    drawArrows(document.getElementById('arrows'), rows, 'af_');
    wireCommon('final', true);
    s.justDone = false;
    if(ready && !s.revDone){
      const els = document.querySelectorAll('#reviewRows .review-row');
      els.forEach((row,i)=>{
        const d = REV_START + i*REV_STEP;
        row.querySelectorAll('.move-result, .badges').forEach(x=>timedFade(x, d, e, REV_FADE, 'rowIn'));
        if(row.classList.contains('best-row')) timedFade(row, d, e, REV_FADE, 'bestIn');
      });
      if(!s.revLoop){
        s.revLoop = true;
        const key = p.key;
        const tick = ()=>{
          if(screen!=='final' || pos().key!==key || !s.checked){ s.revLoop = false; return; }
          const t = performance.now() - s.revAt;
          if(t >= tEnd){ s.revLoop = false; render(); return; }
          if(t >= tCount){
            const num = document.getElementById('finalAcc'), lab = document.getElementById('finalAccLabel');
            if(num) num.textContent = Math.round(acc * easeOut((t - tCount)/COUNT_MS)) + '%';
            if(lab) lab.textContent = 'accuracy';
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }
    return;
  }

  app.innerHTML = `
    ${header('Final choice')}
    ${posBar()}
    ${boardHtml(false)}
    ${stackedPanel(`
      <div id="ranked"></div>
      <p class="hint rank-hint" id="finalHint">Drag the moves into order, best at the top.</p>
      <div class="actions-row" id="finalCheckRow"><button class="btn" id="check">Check</button></div>`, ghostFinal(), engineErrorBanner())}`;
  renderBoard(document.getElementById('board'), bs, p.last);
  drawArrows(document.getElementById('arrows'), ordered, 'ar_');
  const rankedEl = document.getElementById('ranked');
  // Intro: the four moves fade in one after another, then the Check button. Timed from the
  // first time they're shown, so a re-render mid-way picks the animation up where it was.
  if(s.introAt==null) s.introAt = performance.now();
  const introEl = performance.now() - s.introAt;
  // Moves: plain fade. Instruction + Check: fade with the small rise used in Board analysis.
  const fadeAt = (el, delay, kind)=>timedFade(el, delay, introEl, INTRO_FADE, kind || 'rowIn');
  ordered.forEach((m,i)=>{
    const row = document.createElement('div');
    row.className = 'rate-row';
    row.dataset.id = m.id;
    row.innerHTML = `<div class="move-tag"><span class="num">${i+1}</span><span class="move-chip" style="background:${m.color}">${m.san}</span></div><span class="drag-handle" aria-hidden="true">⠿</span>`;
    rankedEl.appendChild(row);
    fadeAt(row, INTRO_START + i*INTRO_STEP);
  });
  // Each move's arrow simply appears (no fade) as its row starts fading in.
  document.querySelectorAll('#arrows line').forEach((ln,i)=>{
    const wait = INTRO_START + i*INTRO_STEP - introEl;
    if(wait > 0) ln.style.animation = `hidden ${wait}ms linear`;
  });
  // The instruction and the Check button fade in together, last.
  const tLast = INTRO_START + ordered.length*INTRO_STEP + 100;
  timedFade(document.getElementById('finalHint'), tLast, introEl, SLIDE_MS, 'fadeIn');
  timedFade(document.getElementById('finalCheckRow'), tLast, introEl, SLIDE_MS, 'fadeIn');
  wireDragReorder(rankedEl, s.order, ()=>{ s.moved = true; render(); });
  document.getElementById('check').onclick = ()=>{ s.checked = true; s.revAt = null; s.revDone = false; render(); };
  wireCommon('final', false);
}

function render(){
  syncPos();
  const wrap = document.querySelector('.wrap');
  wrap.classList.toggle('ex', ACTIVITIES.includes(screen));
  wrap.dataset.screen = screen;
  if(screen==='home') renderHome();
  else if(screen==='progress') renderProgress();
  else if(screen==='tests') renderTests();
  else if(screen==='mygames') renderMyGames();
  else if(screen==='analysis') renderAnalysis();
  else if(screen==='candidates') renderCandidates();
  else renderFinal();
}

render();
initEngine();
(async()=>{
  if(DIRECT_LICHESS) await finishLichessLogin();   // back from lichess.org: signed in before anything loads
  initProgress();
  initMyGames();
})();
</script>
