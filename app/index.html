<title>Chess Strategy Trainer</title>
<style>
  /* Layout: one narrow column, home page of three exercise cards, each exercise = position bar + board + one panel. */
  :root{
    color-scheme: dark;
    --bg:#12161B; --panel:#1B2129; --panel-2:#222A33;
    --text:#EDE7DC; --text-mute:#9A9488;
    --board-light:#E7EFF8; --board-dark:#7096B8;
    --accent:#C9A227; --on-accent:#1A1400;
    --pick1:#3AA655; --pick2:#D64545; --pick3:#4A78D6; --system:#E0B93C; --top3:#B58BE8;
    --white-fill:#E8E2D4; --black-fill:#2B241C;
    --good:#6FAE7C; --best-green:#3FAE5C; --ok:#A4A95E; --dubious:#E8C547; --mistake:#D9A441; --bad:#C9584F;
    --border:#2E3742;
    --cyan:rgba(34,211,238,0.35); --dest-dot:rgba(120,128,138,0.75); --cyan-arrow:#22D3EE;
    --best-row:rgba(224,185,60,0.14); --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.4);
    --piece-w:#F7F3EA; --piece-b:#151515;
    --font-display:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-body:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg); color:var(--text); margin:0;}
  body{font-family:var(--font-body); font-size:15px;}
  .wrap{max-width:520px; margin:0 auto; padding-block:18px 20px; padding-inline:18px; position:relative;}
  /* Exercise screens fill exactly one screen: header pinned to the top, panel pinned to the
     bottom, and the board takes whatever height is left in between (square, never wider than
     the screen, never over 420px). If even that leaves less than ~200px, the page scrolls
     instead of shrinking the board further. */
  .wrap.ex{height:100vh; height:100dvh; display:flex; flex-direction:column;
    padding-block:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));}
  .wrap.ex > #app{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  .stage{flex:1 0 200px; container-type:size; display:flex; align-items:center; justify-content:center;}
  .stage > .board-outer{flex:none; width:min(100cqw, 100cqh, 420px); margin:0;}
  .stage > .board-row{flex:none; width:auto; max-width:none; margin:0;}
  .stage > .board-row .board-outer{flex:none; width:min(100cqw - 44px, 100cqh, 420px);}
  .wrap.ex .posbar{margin:8px 0 10px;}
  .wrap.ex .panel{flex:none; margin-top:10px; display:flex; flex-direction:column; padding:12px 14px;}
  /* Every exercise keeps one panel height from question to review (see .panel-stack). */
  /* Same-height panels: the visible content shares one grid cell with invisible copies of the
     exercise's other states, so the panel is always as tall as the tallest of them — measured
     by the phone's own fonts rather than guessed in pixels. */
  .panel-stack{display:grid; flex:1 1 auto;}
  .panel-stack > .layer{grid-area:1/1; display:flex; flex-direction:column; min-width:0;}
  .panel-stack > .layer.ghost{visibility:hidden; pointer-events:none;}
  .panel-stack > .layer > .actions-row{margin-top:auto; padding-top:5px;}
  /* Final choice's ranking screen is the tallest panel in the app: keep its instruction and
     Check button tight under the moves so the board keeps more room on small phones. */
  .hint.rank-hint{margin-top:4px;}
  .panel-stack > .layer > .hint + .actions-row{padding-top:2px;}

  h1,h2{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  h1{font-size:1.45rem;}
  .title-row{display:flex; align-items:center; gap:10px;}
  .title-row h1{flex:1; min-width:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .title-badge{font-family:var(--font-body); font-size:0.78rem; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:2px 9px; white-space:nowrap;}
  .icon-btn{
    width:28px; height:28px; min-width:28px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text-mute); font-size:0.9rem; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  /* Small round buttons keep their look but get a finger-sized (44px) tap area. */
  .icon-btn,.del-btn,.chip-btn{position:relative;}
  .icon-btn::after,.del-btn::after{content:''; position:absolute; inset:-8px;}
  .chip-btn::after{content:''; position:absolute; inset:-8px -2px;}
  .icon-btn:focus-visible,.btn:focus-visible,.card:focus-visible,.evalbar-v:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* Home */
  .home-head{margin:4px 0 18px;}
  .link-btn#progressBtn{margin-top:8px;}
  .home-head h1{font-size:1.9rem;}
  .home-head p{color:var(--text-mute); margin:8px 0 0; line-height:1.5; max-width:40ch;}
  .cards{display:flex; flex-direction:column; gap:10px;}
  .card{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
    width:100%; text-align:left; cursor:pointer; color:var(--text);
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
  }
  .card:hover{border-color:var(--accent);}
  .card-glyph{font-size:1.9rem; line-height:1; width:36px; text-align:center; color:var(--accent);}
  .card-title{display:block; font-family:var(--font-display); font-weight:600; font-size:1.15rem;}
  .card-desc{display:block; margin-top:4px; color:var(--text-mute); font-size:0.88rem; line-height:1.4;}
  .card-arrow{color:var(--text-mute); font-size:1.3rem;}
  .card-level{display:flex; flex-direction:column; align-items:flex-end; min-width:44px; line-height:1.1;}
  .card-level b{font-family:var(--font-display); font-size:1.45rem; font-weight:600; font-variant-numeric:tabular-nums;}
  .card-level small{color:var(--text-mute); font-size:0.7rem; letter-spacing:0.02em;}

  /* Daily routine (home) */
  .routine{background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:14px 16px 16px; margin:-8px 0 16px;}
  .routine.done{border-color:var(--border);}
  .data-wait{visibility:hidden;}
  .routine-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .routine-title{font-family:var(--font-display); font-weight:600; font-size:1.15rem;}
  .routine-count{font-size:0.84rem; color:var(--text-mute); font-variant-numeric:tabular-nums;}
  .routine-row{display:flex; justify-content:space-between; align-items:center; font-size:0.86rem; color:var(--text-mute); padding:3px 0;}
  .goal-dots{display:flex; gap:5px;}
  .goal-dots i{width:18px; height:6px; border-radius:3px; background:var(--panel-2); border:1px solid var(--border);}
  .goal-dots i.on{background:var(--accent); border-color:var(--accent);}
  .routine-btn{margin-top:12px;}
  .routine-btn{width:100%;}
  .link-row{display:flex; justify-content:space-between; align-items:center; gap:4px 12px; flex-wrap:wrap;}
  a.link-btn{text-decoration:none;}
  .link-btn.quiet{color:var(--text-mute); font-weight:500;}
  .title-spacer{width:36px; flex:none;}
  .test-list{display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-bottom:16px;}
  .test-item{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px 12px; display:flex; flex-direction:column; gap:6px;}
  .test-name{font-weight:600;}
  .test-name small{display:block; font-weight:400; color:var(--text-mute); font-size:0.8rem; margin-top:2px;}
  .test-go{display:flex; flex-wrap:wrap; gap:6px;}
  .chip-btn{background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:5px 10px; font:inherit; font-size:0.8rem; cursor:pointer;}
  .link-btn{background:transparent; border:none; color:var(--accent); font:inherit; font-size:0.9rem; font-weight:600; cursor:pointer; padding:6px 0;}
  .link-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* Average chip in the review's score line */
  .score .level{margin-left:auto; font-size:0.84rem; color:var(--text-mute); white-space:nowrap;}
  .score .level strong{color:var(--text); font-weight:600;}
  .delta-up{color:var(--good); font-weight:600;}
  .delta-down{color:var(--bad); font-weight:600;}

  /* Progress screen */
  .seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:14px 0 16px;}
  .seg-btn{flex:1; background:transparent; color:var(--text-mute); border:none; padding:9px 6px; font:inherit; font-size:0.84rem; cursor:pointer;}
  .seg-btn + .seg-btn{border-left:1px solid var(--border);}
  .seg-btn.active{background:var(--panel-2); color:var(--text); font-weight:600;}
  .seg-btn:disabled{opacity:.45; cursor:default;}
  .card:disabled{opacity:.55; cursor:default;}
  /* Profile */
  .pf-scroll{display:flex; flex-direction:column; gap:12px; overflow-y:auto; min-height:0; padding-bottom:16px;}
  .pf-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .pf-card h2, .pf-h{margin:0; font-size:1rem;}
  .pf-h{margin-top:4px;}
  .pf-name{font-size:1.25rem; font-weight:700;}
  .pf-facts{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:0.86rem; color:var(--text-mute);}
  .pf-lichess{display:flex; gap:12px; align-items:center; margin-top:6px; font-size:0.86rem; color:var(--text-mute);}
  .pf-lichess b{color:var(--text);}
  .pf-note{margin:6px 0 0; font-size:0.8rem; color:var(--text-mute);}
  .pf-note a{color:var(--accent);}
  .pf-delete{font-size:0.8rem; padding:4px 0; color:var(--text-mute);}
  .btn.lichess-btn{background:#fff; color:#161512; display:flex; align-items:center; gap:8px; justify-content:center;}
  .lichess-btn span{font-size:1.2rem; line-height:1;}
  .mg-account{display:flex; justify-content:space-between; gap:12px; align-items:center; margin:0; font-size:0.9rem;}
  .mg-account b{color:var(--text);}
  .mg-account .link-inline{white-space:nowrap;}
  .pf-facts b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums;}
  .wk-table{border-collapse:collapse; width:100%; font-size:0.86rem; font-variant-numeric:tabular-nums;}
  .wk-table th, .wk-table td{padding:5px 4px; text-align:center; border-bottom:1px solid var(--border);}
  .wk-table thead th{font-weight:500; color:var(--text-mute); font-size:1rem;}
  .wk-table tbody th{text-align:left; font-weight:500; white-space:nowrap;}
  .wk-table tr:last-child th, .wk-table tr:last-child td{border-bottom:none;}
  .wk-table tr.idle td, .wk-table tr.idle th{color:var(--text-mute);}
  .wk-done{color:var(--good); font-weight:700;}
  .pf-replay{flex-direction:row; align-items:center; justify-content:space-between; gap:12px;}
  .pf-replay p{margin:4px 0 0; font-size:0.8rem; color:var(--text-mute);}
  .pf-replay .btn{flex:none; white-space:nowrap;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .source-row{display:flex; align-items:center; gap:10px;}
  .source-label{font-size:0.8rem; color:var(--text-mute); white-space:nowrap;}
  .seg.seg-sm{flex:1; margin:0;}
  .seg.seg-sm .seg-btn{padding:6px 4px; font-size:0.8rem;}
  /* My games */
  .mg-scroll{display:flex; flex-direction:column; gap:12px; overflow-y:auto; padding-bottom:16px; min-height:0;}
  .mg-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; min-width:0;}
  .mg-card h2{margin:0; font-size:1rem;}
  .mg-field{display:flex; flex-direction:column; gap:4px; font-size:0.8rem; color:var(--text-mute);}
  .mg-field input{font:inherit; font-size:0.95rem; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
  .mg-field input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .mg-check{display:flex; align-items:center; gap:8px; font-size:0.88rem;}
  .mg-steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:10px;}
  .mg-steps li{padding-left:2px;}
  .mg-steps a{color:var(--accent); font-weight:600; text-decoration:none;}
  .mg-steps small{display:block; color:var(--text-mute); font-size:0.78rem; margin-top:2px;}
  .btn.small{padding:7px 12px; font-size:0.86rem;}
  .file-btn{position:relative; display:inline-flex; overflow:hidden;}
  .file-input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;}
  .file-btn:focus-within{outline:2px solid var(--text); outline-offset:2px;}
  .link-inline{background:none; border:none; padding:0; font:inherit; color:var(--accent); text-decoration:underline; cursor:pointer;}
  .file-link{position:relative; display:inline;}
  .mg-sub{margin:0; font-size:0.8rem; color:var(--text-mute);}
  .mg-paste{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .mg-paste textarea{font:0.8rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:8px; resize:vertical; min-width:0;}
  .mg-paste .btn{align-self:flex-start;}
  .btn.ghost{background:transparent; color:var(--text); border-color:var(--border);}
  .btn.danger{background:var(--bad); color:#fff;}
  .mg-note, .mg-status{margin:0; font-size:0.84rem; color:var(--text-mute);}
  .mg-table-wrap{overflow-x:auto;}
  .mg-table{border-collapse:collapse; width:100%; font-size:0.84rem; font-variant-numeric:tabular-nums;}
  .mg-table th, .mg-table td{padding:6px 4px; text-align:right; border-bottom:1px solid var(--border);}
  .mg-table thead th{font-weight:500; color:var(--text-mute); font-size:0.74rem; vertical-align:bottom;}
  .mg-table tbody th{text-align:left; font-weight:600;}
  .mg-table tr:last-child th, .mg-table tr:last-child td{border-bottom:none;}
  .mg-confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:0.86rem;}
  .seg-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .hero{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .hero-num{font-family:var(--font-display); font-size:2.6rem; line-height:1; font-variant-numeric:tabular-nums;}
  .hero-tier{color:var(--text-mute); font-size:0.9rem; margin-top:4px;}
  .hero-week{text-align:right; font-size:0.84rem; color:var(--text-mute);}
  .chart-box{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 10px 8px; position:relative;}
  .chart-box svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart-legend{display:flex; gap:14px; font-size:0.76rem; color:var(--text-mute); margin:2px 4px 6px;}
  .chart-legend span{display:inline-flex; align-items:center; gap:6px;}
  .lg-line{width:14px; height:2px; background:var(--accent); border-radius:1px;}
  .lg-dot{width:7px; height:7px; border-radius:50%; background:var(--text-mute); opacity:.6;}
  .lg-dot.mine{background:var(--cyan-arrow); opacity:.85;}
  .chart-tip{position:absolute; pointer-events:none; background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:0.76rem; line-height:1.35; white-space:nowrap; transform:translate(-50%, -100%); color:var(--text);}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .stat b{display:block; font-family:var(--font-display); font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat small{color:var(--text-mute); font-size:0.74rem;}
  .empty{color:var(--text-mute); font-size:0.9rem; line-height:1.5; padding:22px 6px; text-align:center;}

  /* Position bar */
  .posbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin:12px 0 12px;}
  .pos-title{font-size:0.86rem; color:var(--text-mute); min-width:0;}
  .pos-title strong{color:var(--text); font-weight:600;}

  /* Board */
  .board-outer{width:100%; max-width:420px; margin:0 auto; position:relative; z-index:0;}
  .board{
    width:100%; max-width:100%; aspect-ratio:1/1; display:grid;
    grid-template-columns:repeat(8, minmax(0,1fr)); grid-template-rows:repeat(8, minmax(0,1fr));
    border:1px solid var(--border); border-radius:2px; overflow:hidden;
  }
  .board{container-type:inline-size;}
  .sq{position:relative; display:flex;align-items:center;justify-content:center; font-size:10cqw; line-height:1; user-select:none;}
  .sq.light{background:var(--board-light);}
  .sq.dark{background:var(--board-dark);}
  .sq.last::before{content:""; position:absolute; inset:0; background:var(--cyan);}
  .sq.selected::before{content:""; position:absolute; inset:0; background:var(--cyan);}
  .sq.check{background-image:radial-gradient(circle at center, rgba(255,40,40,1) 0%, rgba(230,0,0,.85) 28%, rgba(200,0,0,.35) 58%, rgba(170,0,0,0) 80%);}
  .sq.dest::after{content:""; position:absolute; width:26%; height:26%; border-radius:50%; background:var(--dest-dot); top:50%; left:50%; transform:translate(-50%,-50%); z-index:1; pointer-events:none;}
  .sq.dest-capture::after{content:""; position:absolute; inset:8%; border:3px solid var(--dest-dot); border-radius:50%; z-index:1; pointer-events:none;}
  .sq .piece-w{color:var(--piece-w); text-shadow:0 0 1px #000, 0 0 2px rgba(0,0,0,.5); z-index:1;}
  .sq .piece-b{color:var(--piece-b); text-shadow:0 0 1px rgba(255,255,255,.3); z-index:1;}
  .promo-overlay{position:absolute; inset:0; z-index:8; background:var(--scrim); container-type:inline-size; cursor:pointer;}
  .promo-col{position:absolute; top:0; width:12.5%; display:flex; flex-direction:column; border-radius:6px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.45);}
  .promo-piece{aspect-ratio:1; width:100%; padding:0; border:0; background:var(--board-light); font-size:10cqw; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .promo-piece:nth-child(even){background:var(--board-dark);}
  .promo-piece .piece-w{color:var(--piece-w); text-shadow:0 0 1px #000, 0 0 2px rgba(0,0,0,.5);}
  .promo-piece .piece-b{color:var(--piece-b); text-shadow:0 0 1px rgba(255,255,255,.3);}
  svg.arrows{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5;}

  .board-row{display:flex; gap:10px; align-items:stretch; justify-content:center; width:100%; max-width:420px; margin:0 auto;}
  .board-row .board-outer{flex:1 1 auto; max-width:none; width:auto; margin:0; min-width:0;}
  .evalbar-wrap{flex:0 0 auto; display:flex; position:relative; width:34px;}
  .evalbar-v{flex:1; border:1px solid var(--border); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; position:relative;}
  .evalbar-num{position:absolute; left:0; right:0; text-align:center; font-size:0.68rem; font-weight:700; font-variant-numeric:tabular-nums; pointer-events:none; letter-spacing:-0.02em;}
  .evalbar-v .v-black{background:var(--black-fill);}
  .evalbar-v .v-white{background:var(--white-fill);}
  .evalbar-cursor{position:absolute; left:0; right:0; height:3px; background:var(--accent); transform:translateY(50%); pointer-events:none;}
  .evalbar-cursor[style^="top"]{transform:translateY(-50%);}
  .evalbar-v.interactive{border-color:var(--accent);}
  .evalbar-wrap:has(.interactive){cursor:ns-resize; touch-action:none;}
  /* Drag handle: a gold line with small triangles above and below, inviting an up/down drag. */
  .evalbar-cursor.handle{height:4px; left:-3px; right:-3px; border-radius:2px; box-shadow:0 0 0 1px var(--bg);}
  .evalbar-cursor.handle::before,.evalbar-cursor.handle::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    border-left:6px solid transparent; border-right:6px solid transparent;
  }
  .evalbar-cursor.handle::before{bottom:calc(100% + 3px); border-bottom:7px solid var(--accent);}
  .evalbar-cursor.handle::after{top:calc(100% + 3px); border-top:7px solid var(--accent);}

  /* Panel */
  .panel{width:100%; max-width:420px; margin:16px auto 0; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px;}
  .hint{color:var(--text-mute); font-size:0.86rem; line-height:1.5; margin:10px 0 0;}
  .engine-error{color:var(--bad); margin-top:12px;}
  .score{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
  .score-num{font-family:var(--font-display); font-size:1.7rem; line-height:1.15; font-variant-numeric:tabular-nums;}
  .score-label{color:var(--text-mute); font-size:0.86rem;}

  .prompt{margin:0; font-size:1rem; line-height:1.45;}
  .recap{margin:0; font-size:1rem; line-height:1.45; min-height:2.9em;}
  /* Buttons that will fade in later already take their space, so nothing grows when they appear. */
  .actions-row.pending{visibility:hidden;}
  .fade-in{animation:fadeIn .35s ease-out both;}
  @keyframes hidden{from,to{opacity:0;}}
  @keyframes rowIn{from{opacity:0;}}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .btn{background:var(--accent); color:var(--on-accent); border:1px solid transparent; border-radius:6px; padding:10px 18px; font-size:0.94rem; line-height:1.25; font-weight:600; cursor:pointer;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text); font-weight:500;}
  a.btn{display:inline-flex; align-items:center; text-decoration:none;}
  .actions-row{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .actions-row.split{justify-content:space-between;}
  .actions-row.split > .btn{flex:1 1 0; justify-content:center; padding-inline:12px; white-space:nowrap;}
  @media (max-width:400px){ .actions-row.split > .btn{font-size:0.84rem; padding-inline:6px;} .actions-row.split{gap:8px;} }
  .actions-row.split{flex-wrap:nowrap;}
  .actions-row.split > .btn{min-width:0;}
  @media (max-width:360px){ .actions-row.split > .btn{white-space:normal; line-height:1.2;} }
  @media (max-width:370px){ .actions-row.split > .btn{font-size:0.78rem; padding-inline:4px;} }

  /* Move rows in every list share one look: same height, rounded ends, a line under each row
     including the last. */
  .rate-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 -8px; padding:2px 8px 2px 12px;
    border-bottom:1px solid var(--border); border-left:3px solid transparent; border-radius:6px;}
  .rate-row, .review-row.pick-row{min-height:40px; padding-block:2px;}
  .rev-list .review-row{min-height:34px; padding-block:2px;}
  .move-tag{display:flex;align-items:center;gap:8px; font-size:0.96rem; min-width:0; flex-wrap:wrap;}
  .move-tag .num{opacity:.6; min-width:1ch; font-variant-numeric:tabular-nums;}
  .del-btn{width:26px; height:26px; margin-block:-4px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; padding:0;

  .del-btn:hover{color:var(--text); background:var(--panel-2);}
  .del-btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .drag-handle{color:var(--text-mute); font-size:1.1rem; cursor:grab; padding:4px 6px; user-select:none; line-height:1;}
  #ranked .rate-row{position:relative; cursor:grab;}
  #ranked .rate-row.dragging{cursor:grabbing; z-index:5; background:var(--panel-2); border-radius:6px; box-shadow:0 6px 18px var(--shadow);}

  .review-row{padding:3px 8px 3px 12px; margin:0 -8px; border-bottom:1px solid var(--border); border-left:3px solid transparent; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px 10px; border-radius:6px;}

  .review-cols{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:4px;}
  .review-col{min-width:0;}
  .col-toggle{display:flex; align-items:center; gap:7px; width:100%; background:transparent; border:none;
    color:var(--text-mute); font:inherit; font-size:0.82rem; font-weight:600; letter-spacing:0.02em; padding:2px 2px 4px; cursor:pointer; text-align:left;}
  .col-toggle.on{color:var(--text);}
  .col-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .col-toggle-box{width:13px; height:13px; border:1.5px solid var(--text-mute); border-radius:3px; flex:0 0 auto; position:relative;}
  .col-toggle.on .col-toggle-box{background:var(--accent); border-color:var(--accent);}
  .col-toggle.on .col-toggle-box::after{content:""; position:absolute; left:3.5px; top:0.5px; width:3px; height:7px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg);}
  .mini-row{display:grid; grid-template-columns:auto auto 1fr; align-items:center; gap:7px; padding:2px 6px 2px 4px; border-bottom:1px solid var(--border); border-left:3px solid transparent; border-radius:5px;}
  .mini-row .num{opacity:.6; font-size:0.85rem; font-variant-numeric:tabular-nums;}
  .mini-row.best-row{background:var(--best-row); border-left-color:var(--system);}
  .mini-row.best-in{animation:bestIn .5s ease-out both;}
  @keyframes bestIn{from{background:transparent; border-left-color:transparent;}}
  .mini-row.muted{opacity:.45;}
  .mini-row{transition:transform .55s cubic-bezier(.2,.8,.2,1);}
  .mini-row.sorting{position:relative; z-index:2; background:var(--panel);}
  .move-chip{color:var(--bg); font-weight:700; font-size:0.86rem; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .mini-result{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2; min-width:0;}
  .mini-label{font-size:0.74rem; font-weight:600; color:var(--text-mute);}
  .grade{font-size:0.8rem; font-weight:600; color:var(--text-mute);}
  .mini-result .move-eval{font-size:0.78rem; min-width:0;}
  .review-row.best-row{background:var(--best-row); border-left-color:var(--system);}
  .badges{display:flex; flex-wrap:wrap; gap:6px;}
  .badge{font-size:0.72rem; padding:2px 9px; border-radius:10px; border:1px solid var(--border); color:var(--text-mute); background:var(--panel-2); white-space:nowrap;}
  .move-result{display:flex; align-items:center; gap:8px;}
  .move-eval{font-size:0.85rem; color:var(--text-mute); font-variant-numeric:tabular-nums; min-width:3.6em; text-align:right;}

  .modal-backdrop{position:fixed; inset:0; background:var(--scrim); z-index:10;}
  .modal-backdrop-inner{height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .modal-box{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; max-width:380px; max-height:90%; overflow:auto;}
  .modal-box h3{margin:0 0 10px; font-size:1.05rem; font-family:var(--font-display);}
  .modal-box p{font-size:0.88rem; color:var(--text); line-height:1.55; margin:0 0 10px;}
  .modal-box p.eval-note{color:var(--text-mute);}
  .modal-actions{display:flex; justify-content:flex-end; margin-top:4px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }

function labelColor(label){
  if(label==='Best') return 'var(--best-green)'; // a stronger, more saturated green than an ordinary Good move
  if(label==='Good') return 'var(--good)';
  if(label==='Ok') return 'var(--ok)';
  if(label==='Dubious') return 'var(--dubious)';
  if(label==='Mistake') return 'var(--mistake)';
  if(label==='Blunder') return 'var(--bad)';
  return 'var(--text-mute)';
}

    eval:"Each move is scored by how much it gives up compared with the engine's best. Don't pick Dubious or worse moves: they count as fully missed, so you're better off picking fewer moves.",
    grades: GRADES + " Tap a list's title to show its arrows. Greyed-out top moves are Dubious or worse.",
  },
  final: {
    title:'Final choice',
    what:"Rank the four moves from best to worst. One of them is the move played in the game.",
    eval:"Each of your first three places is compared with the best move you haven't placed yet: 1st counts 50%, 2nd 30%, 3rd 20%. A move as good as that one earns the place in full; the further below it, the less, and a move 10 or more points of winning chances below it earns nothing.",
    grades: GRADES + " <strong>Game move</strong> marks the move actually played.",
  },
};

function boardObjFromGame(g){
  const obj = {};
  g.board().forEach((row,ri)=>row.forEach((cell,fi)=>{
    if(!cell) return;
    const sq = FILES[fi] + (8-ri);
    const ch = cell.type.toUpperCase();
    obj[sq] = cell.color==='w' ? ch : ch.toLowerCase();
  }));
  return obj;
}

// --- Real evaluation, via Stockfish running in a Web Worker over the UCI protocol ---
// Loaded from a single-file build (older Stockfish, asm.js/WASM hybrid with the engine
// binary embedded) so there's no separate .wasm fetch to wire up — good enough strength
// for this app's purposes, per the "doesn't need to be state of the art" brief.
// Two CDN copies of the exact same file: cdnjs first (the sandbox's preferred allowlisted
// host), jsdelivr as a fallback if that fetch fails for any reason.
const SF_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
  "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js"
];
// MultiPV is set per query (see pumpEngineQueue): an unrestricted "discovery" search asks for
// the top DISCOVERY_MULTIPV lines; a combined search restricted to N specific moves asks for
// exactly N lines, so every one of those moves gets its own ranked, comparable score.
const DISCOVERY_MULTIPV = 5;
let sfWorker = null;
let sfState = 'loading'; // 'loading' | 'ready' | 'error'
let sfLastError = null;  // why the engine failed, only set on 'error' (picks the banner's wording)
let sfWatch = null;      // watchdog for the search in flight (see pumpEngineQueue)
let sfQueue = [];        // {fen, searchmoves, resolve}: the exercises' own searches, always first
let bgQueue = [];        // {fen, searchmoves, multipv, movetime, resolve}: background work (scanning
                         // your games), run only when no exercise search is waiting
let sfBusy = false;
let sfCurrentResolve = null;
let sfCurrentLines = {}; // rank (1..N) -> {cp, mate, uci} for the search currently in flight

// fetch() to either CDN is blocked in this sandbox (confirmed: both attempts failed before
// even reaching the Worker), so the engine source text can't be fetched from page JS and
// wrapped in a blob directly. Two other transports don't go through page-level fetch/XHR
// at all, so they aren't subject to the same restriction:
//  - "bootstrap": a same-origin blob: worker whose only content is `importScripts(url)` —
//    that import is a script load (governed by script-src, which already allows these CDNs
//    for the chess.js <script> tag), not a fetch/XHR (governed by connect-src).
//  - "direct": `new Worker(url)` straight at the cross-origin CDN URL, no blob at all.
// Try both transports against both CDNs before giving up.
function initEngine(){ attemptEngineLoad(0); }
const ENGINE_ATTEMPTS = [
  {url: SF_URLS[0], mode:'bootstrap'},
  {url: SF_URLS[1], mode:'bootstrap'},
  {url: SF_URLS[0], mode:'direct'},
  {url: SF_URLS[1], mode:'direct'}
];
function attemptEngineLoad(i){
  if(i>=ENGINE_ATTEMPTS.length){
    failEngine('the engine could not be loaded from any source (fetch, importScripts and direct Worker construction were all blocked)');
    return;
  }
  const {url, mode} = ENGINE_ATTEMPTS[i];
  let worker;
  try{
    if(mode==='bootstrap'){
      const blob = new Blob(['importScripts('+JSON.stringify(url)+');'], {type:'application/javascript'});
      worker = new Worker(URL.createObjectURL(blob));
    } else {
      worker = new Worker(url);
    }
  } catch(err){
    attemptEngineLoad(i+1);
    return;
  }
  let settled = false;
  const timeoutId = setTimeout(()=>{
    if(settled) return;
    settled = true;
    try{ worker.terminate(); }catch(err){}
    attemptEngineLoad(i+1);
  }, 6000);
  // Handshake-only handler: watches for uciok/readyok, then hands off to the persistent
  // onEngineMessage handler for real queries once this transport is proven to work.
  worker.onmessage = (e)=>{
    const raw = typeof e.data==='string' ? e.data : '';
    raw.split('\n').forEach(rawLine=>{
      const line = rawLine.trim();
      if(!line) return;
      if(line==='uciok'){ worker.postMessage('setoption name MultiPV value '+DISCOVERY_MULTIPV); worker.postMessage('isready'); return; }
      if(line==='readyok' && !settled){
        settled = true; clearTimeout(timeoutId);
        sfWorker = worker;
        sfWorker.onmessage = onEngineMessage;
        sfWorker.onerror = ()=>{ failEngine('stopped'); };
        sfState = 'ready'; sfLastError = null;
        render(); pumpEngineQueue(); if(myGamesLoaded) myBackground();
      }
    });
  };
  worker.onerror = ()=>{
    if(settled) return;
    settled = true; clearTimeout(timeoutId);
    attemptEngineLoad(i+1);
  };
  worker.postMessage('uci');
}
// Persistent handler for the working transport: parses MultiPV info lines (one per ranked
// line Stockfish is tracking) and the closing bestmove for pumpEngineQueue.
function onEngineMessage(e){
  const raw = typeof e.data==='string' ? e.data : '';
  raw.split('\n').forEach(rawLine=>{
    const line = rawLine.trim();
    if(!line) return;
    if(line.indexOf('info')===0 && line.indexOf('score')!==-1){
      const mpvM = line.match(/multipv (\d+)/);
      const rank = mpvM ? parseInt(mpvM[1],10) : 1; // MultiPV always tags its lines; rank 1 if somehow absent
      const mateM = line.match(/score mate (-?\d+)/);
      const cpM = line.match(/score cp (-?\d+)/);
      const pvM = line.match(/ pv (\S+)/); // first move of that line's principal variation
      sfCurrentLines[rank] = {
        cp: mateM ? null : (cpM ? parseInt(cpM[1],10) : null),
        mate: mateM ? parseInt(mateM[1],10) : null,
        uci: pvM ? pvM[1] : null
      };
      return;
    }
    if(line.indexOf('bestmove')===0){
      const bestUci = line.split(/\s+/)[1] || null;
      // Collected in rank-label order (1..N), dropping any rank MultiPV never got to report.
      const collected = Object.keys(sfCurrentLines).map(Number).sort((a,b)=>a-b).map(r=>sfCurrentLines[r]);
      // MultiPV's own rank label is *supposed* to already be best-first, but under a
      // movetime-bounded search that's not guaranteed: different ranks can finish their last
      // deepening pass at slightly different moments, so whatever was last printed under
      // "rank 1" when time ran out can occasionally be a shallower (and lower-scoring) read
      // than what's sitting under "rank 2" — the exact bug that let a lower-scoring move wear
      // the "Best" badge. Re-sorting by actual win% here — the same curve every other
      // comparison in the app already uses — makes lines[0] the true strongest line regardless
      // of which label the engine happened to leave it under, rather than trusting a rank
      // number that only holds once every line has finished converging.
      const lines = collected.slice().sort((a,b)=> winPercent(b.cp,b.mate) - winPercent(a.cp,a.mate));
      const result = lines.length ? { lines, bestUci } : FAILED;
      sfCurrentLines = {};
      const resolve = sfCurrentResolve;
      sfBusy = false; sfCurrentResolve = null;
      if(resolve) resolve(result);
      pumpEngineQueue();
    }
  });
}
// No engine = no evaluation: every waiting request (including the one in flight) resolves as
// FAILED, never as a made-up 0.00 — screens show "evaluation unavailable" instead of a score.
const FAILED = { lines:[], bestUci:null, failed:true };
function failEngine(reason){
  sfState = 'error';
  sfLastError = reason || 'unknown error';
  const pending = sfQueue.splice(0, sfQueue.length).concat(bgQueue.splice(0, bgQueue.length));
  if(sfCurrentResolve){ pending.push({ resolve: sfCurrentResolve }); sfCurrentResolve = null; }
  sfBusy = false; sfCurrentLines = {};
  pending.forEach(({resolve})=>resolve(FAILED));
  render();
}
const evalFailed = d => !!(d && d.failed);
function pumpEngineQueue(){
  if(sfBusy || sfState!=='ready') return;
  // An exercise's search always goes first; background work only fills idle time, one short
  // search at a time, so a waiting review is never more than one quick search away.
  const job = sfQueue.length ? sfQueue.shift() : bgQueue.length ? bgQueue.shift() : null;
  if(!job) return;
  const {fen, searchmoves, resolve} = job;
  sfBusy = true; sfCurrentResolve = resolve; sfCurrentLines = {};
  // One ranked line per restricted move (so every move in a combined search gets its own
  // comparable score), or the top DISCOVERY_MULTIPV lines for an unrestricted search.
  const mpv = searchmoves ? searchmoves.split(' ').length : (job.multipv || DISCOVERY_MULTIPV);
  sfWorker.postMessage('setoption name MultiPV value '+mpv);
  sfWorker.postMessage('position fen '+fen);
  // `searchmoves` restricts the root search to a specific set of moves, still from `fen`'s own
  // side-to-move perspective — same kind of query as an unrestricted one, just narrowed.
  sfWorker.postMessage('go movetime '+(job.movetime || 1200)+(searchmoves ? ' searchmoves '+searchmoves : ''));
  // Watchdog: a search that hasn't answered 5 s after its time is told to stop; 5 s after that,
  // the engine counts as failed (instead of every exercise waiting forever).
  clearTimeout(sfWatch);
  sfWatch = setTimeout(()=>{
    if(sfCurrentResolve!==resolve) return;
    try{ sfWorker.postMessage('stop'); }catch(e){}
    sfWatch = setTimeout(()=>{ if(sfCurrentResolve===resolve) failEngine('stopped'); }, 5000);
  }, (job.movetime || 1200) + 5000);
}
// Background search (scanning your games): same result shape as engineEval, but queued behind
// every exercise search. opts: {multipv, movetime, searchmoves}.
function bgEval(fen, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    if(sfState==='error'){ resolve(FAILED); return; }
    bgQueue.push({fen, searchmoves:opts.searchmoves, multipv:opts.multipv, movetime:opts.movetime, resolve});
    pumpEngineQueue();
  });
}
// Raw engine call for one position (optionally restricted to a set of root moves): returns
// { lines: [{cp,mate,uci}, ...] (best first, all from the perspective of whichever side
// is to move in `fen`), bestUci }.
function engineEval(fen, searchmoves){
  return new Promise(resolve=>{
    if(sfState==='error'){ resolve(FAILED); return; }
    sfQueue.push({fen, searchmoves, resolve});
    pumpEngineQueue();
  });
}
// Only ever renders something when the engine failed to load — silent otherwise.
// Placed at the very bottom of an exercise's panel, below the action buttons.
function engineErrorBanner(){
  if(sfState!=='error') return '';
  return `<p class="hint engine-error">The chess engine ${sfLastError==='stopped' ? 'stopped working' : "couldn't be loaded"}, so positions can't be evaluated. Try reloading the page.</p>`;
}

// Cache of engine results keyed by FEN, with a synchronous read: returns the result once
// it's in, or null while still loading (kicking off the request on first ask). render()
// is called again the moment a pending request resolves, so callers just re-check next paint.
// The entry also keeps the underlying promise, so a prefetch can chain more work onto the
// same request instead of issuing a second, duplicate search for the same position.
let fenEvalStore = {};
function fenEvalEntry(fen){
  let entry = fenEvalStore[fen];
  if(!entry){
    entry = { status:'pending', data:null };
    fenEvalStore[fen] = entry;
    engineEval(fen).then(data=>{ entry.status='done'; entry.data=data; render(); });
  }
  return entry;
}
function fenEval(fen){
  const entry = fenEvalEntry(fen);
  return entry.status==='done' ? entry.data : null;
}
// One combined search over an exact SET of candidate moves, restricted via UCI's own
// multi-move `searchmoves` (a space-separated list — the UCI protocol allows more than one
// move there, not just the single-move restriction used elsewhere), with MultiPV ranking them
// against each other in a single search. This is what every displayed move's grade reads from
// (see moveOutcome below): two moves shown side by side always come from the SAME engine
// invocation, so they can never disagree the way comparing numbers from two independent
// searches sometimes could — a real-time-bounded search (`movetime`, not a fixed depth)
// naturally reaches a slightly different depth call to call, so a move scored via its own
// separate search could come back a hair better or worse than another move's number from a
// different search of the same position, even though nothing was actually wrong with either
// search on its own. One shared search removes that possibility entirely, still using nothing
// but Stockfish's own ranking.
let poolEvalStore = {};
function poolEval(baseFen, ucis){
  const key = baseFen+'|pool:'+ucis.slice().sort().join(',');
  let entry = poolEvalStore[key];
  if(!entry){
    entry = { status:'pending', data:null };
    poolEvalStore[key] = entry;
    engineEval(baseFen, ucis.join(' ')).then(data=>{ entry.status='done'; entry.data=data; render(); });
  }
  return entry.status==='done' ? entry.data : null;
}

// {cp,mate} for `fen` reported from Black's/White's perspective as UCI gives it — flip to
// White's absolute perspective when `fen`'s side to move is Black.
function toWhitePerspective(info, fen){
  if(!info) return null;
  const turn = fen.split(' ')[1];
  if(turn==='w') return info;
  return { cp: info.cp!=null ? -info.cp : null, mate: info.mate!=null ? -info.mate : null };
}
// The eval bar's height (and the Board analysis score built from it) uses the same win% curve
// as move grading (winPercent, below). Clamped to 1-99 so the bar always keeps a sliver of the
// other colour, even at a reported mate.
function cpToPct(cp, mate){
  return Math.max(1, Math.min(99, winPercent(cp, mate)));
}
// Every score in the app: one decimal, a real minus sign ("+0.4", "−1.6", "0.0", "+M3").
function fmtSigned(info){
  if(!info) return '…';
  if(info.mate!=null) return (info.mate>0 ? '+' : '−')+'M'+Math.abs(info.mate);
  const r = Math.round(info.cp/10)/10;
  return (r>0 ? '+' : r<0 ? '−' : '') + Math.abs(r).toFixed(1);
}

// Lichess's own model for turning a centipawn/mate score into an estimated win percentage for
// whoever is to move (the exact curve their client and server code both use — a logistic over
// centipawns, saturating at 0/100 for a mate score). The single source of truth for "win%"
// throughout the app — the Dubious/Mistake/Blunder thresholds below, the eval bar (cpToPct,
// above), and the Board-analysis accuracy score all read from this one curve.
function winPercent(cp, mate){
  if(mate!=null) return mate>0 ? 100 : 0;
  const raw = 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
  return Math.max(0, Math.min(100, raw));
}
// "Best" means exactly one thing: this move IS the engine's own rank-1 line for baseFen —
// never a "close enough" bucket, so two different moves can't both show "Best" just because
// their scores happen to land within a few centipawns of each other. If two moves genuinely
// tie in evaluation, only the actual top line gets the badge; the other still gets full
// credit through the numeric accuracy score (pickAccuracyPct/rankAccuracyPct compare evaluations
// values, not labels), it just doesn't also claim to be "the" best.
//
// Everything else is graded the way Lichess grades it: by how many points of win% a move gives
// up against the best line, not by a fixed centipawn amount — the same numeric slip matters far
// more near an even position than once one side is already close to winning or losing, and a
// win%-based cutoff tracks that automatically. Lichess's own published thresholds only start at
// >=30 points → Blunder, >=20 → Mistake, >=10 → Dubious (their "Inaccuracy") — anything under 10
// is just "not annotated" on their site, which in practice lumps a near-perfect move together
// with one that's already given up most of that 10-point budget. "Ok" splits that unannotated
// range in two — there's no published standard for where, so it's our own extension, done the
// same way (win%, not raw centipawns) rather than a new metric. Good is deliberately kept
// narrow (under 3 points) so it means "essentially the top choice," not just "in the same
// ballpark" — anything giving up more of that budget reads as Ok rather than still Good.
function labelFromWinDrop(winDrop, isTop){
  if(isTop) return {label:'Best', category:'good'};
  if(winDrop>=30) return {label:'Blunder', category:'bad'};
  if(winDrop>=20) return {label:'Mistake', category:'bad'};
  if(winDrop>=10) return {label:'Dubious', category:'dubious'};
  if(winDrop>=3) return {label:'Ok', category:'ok'};
  return {label:'Good', category:'good'};
}

// Grades one move by reading it out of an exercise's single evaluation (candidatesEval /
// finalEval — one combined search), never by firing a search of its own. So every move
// on screen, the Best flag and the accuracy baseline all come from that one result, and can
// never disagree with each other. Best = the evaluation's own rank 1 (lines are sorted by
// win%, see onEngineMessage).
// The win% drop is computed in baseFen's own side-to-move perspective throughout, then cp/mate
// are converted to White's absolute perspective only at the very end, for display — the same
// convention the eval bar uses.
// Returns null while the evaluation is still pending (or if the move somehow isn't in it).
function moveOutcome(baseFen, uci, evalData){
  if(!evalData || !evalData.lines || !evalData.lines.length) return null;
  const rank1 = evalData.lines[0];
  const matched = evalData.lines.find(l=>l.uci===uci);   // full move code: e7e8q and e7e8n are different moves
  if(!matched) return null;
  const isTop = matched===rank1;
  const winPct = winPercent(matched.cp, matched.mate); // mover-perspective — win% of this move
  const winDrop = Math.max(0, winPercent(rank1.cp, rank1.mate) - winPct);
  const {label, category} = labelFromWinDrop(winDrop, isTop);
  const turn = baseFen.split(' ')[1];
  const cp = matched.mate!=null ? null : (turn==='w' ? matched.cp : -matched.cp);
  const mate = matched.mate!=null ? (turn==='w' ? matched.mate : -matched.mate) : null;
  const moverCp = moverScore(matched); // side-to-move perspective, in centipawns — what your moves are sorted by
  return { cp, mate, isTop, label, category, winDrop, winPct, moverCp };
}


// Board seen from the side to play: when Black is to play, Black's pieces sit at the bottom.
function boardFlipped(){ return pos().side==='b'; }
function squareCenter(sq){
  const file = FILES.indexOf(sq[0]);
  const rank = parseInt(sq[1],10);
  return boardFlipped() ? { x: (7-file)*60+30, y: (rank-1)*60+30 } : { x: file*60+30, y: (8-rank)*60+30 };
}

function renderBoard(container, boardOverride, lastOverride, opts){
  const bs = boardOverride || {};
  const lm = lastOverride || null;
  opts = opts || {};
  const destSet = new Set(opts.destSquares || []);
  container.innerHTML = '';
  const flip = boardFlipped();
  const checkSq = checkedKingSquare(pos().fen);
  for(let row=0; row<8; row++){
    const rank = flip ? row+1 : 8-row;
    for(let col=0; col<8; col++){
      const f = flip ? 7-col : col;
      const sq = FILES[f]+rank;
      const light = (f+rank)%2===0;
      const div = document.createElement('div');
      div.className = 'sq '+(light?'light':'dark');
      const lmHit = lm && (lm.squares ? lm.squares.includes(sq) : (sq===lm.from || sq===lm.to));
      if(lmHit) div.className += ' last';
      if(opts.selectedSq===sq) div.className += ' selected';
      if(checkSq===sq) div.className += ' check';
      if(destSet.has(sq)) div.className += bs[sq] ? ' dest-capture' : ' dest';
      const p = bs[sq];
      if(p){
        const span = document.createElement('span');
        span.className = p === p.toUpperCase() ? 'piece-w' : 'piece-b';
        span.textContent = PIECES[p];
        div.appendChild(span);
      }
      if(opts.onSquareClick){
        div.style.cursor = 'pointer';
        div.onclick = ()=>opts.onSquareClick(sq);
      }
      container.appendChild(div);
    }
  }
}


// Promotion: a column of the four pieces over the promotion square (queen nearest the edge, as
// on Lichess). Picking a piece adds that move; tapping anywhere else cancels.
const PROMO_NAMES = {q:'queen', n:'knight', r:'rook', b:'bishop'};
function showPromotionPicker(chess, addPick){
  const {from, to} = promoPending;
  const outer = document.querySelector('.board-outer');
  const f = FILES.indexOf(to[0]), col = boardFlipped() ? 7-f : f;
  const w = side==='w';
  const ov = document.createElement('div');
  ov.className = 'promo-overlay';
  ov.innerHTML = `<div class="promo-col" style="left:${col*12.5}%">${['q','n','r','b'].map(k=>
    `<button class="promo-piece" data-p="${k}" aria-label="Promote to ${PROMO_NAMES[k]}"><span class="${w?'piece-w':'piece-b'}">${PIECES[w?k.toUpperCase():k]}</span></button>`).join('')}</div>`;
  ov.onclick = e=>{
    const b = e.target.closest('.promo-piece');
    if(b){ const mv = chess.moves({square:from, verbose:true}).find(m=>m.to===to && m.promotion===b.dataset.p); if(mv) addPick(mv); }
    promoPending = null; render();
  };
  outer.appendChild(ov);
}
// The square of the side to move's king when it is in check, else null.
function checkedKingSquare(fen){
  const g = new Chess(fen);
  if(!g.in_check()) return null;
  const turn = g.turn();
  for(const f of FILES) for(let r=1; r<=8; r++){ const pc = g.get(f+r); if(pc && pc.type==='k' && pc.color===turn) return f+r; }
  return null;
}
function colorOf(p){ return p===p.toUpperCase() ? 'w' : 'b'; }
// SAN of a move given by its UCI code (e2e4, e7e8q): the promotion piece picks the move.
function sanForUci(fen, uci){
  const g = new Chess(fen), from = uci.slice(0,2), to = uci.slice(2,4), promo = uci[4] || '';
  const m = g.moves({square:from, verbose:true}).find(mv=>mv.to===to && (mv.promotion||'')===promo);
  return m ? m.san : to;
}
function drawArrows(svg, list, keyPrefix){
  const defs = list.map((m,i)=>
    `<marker id="${keyPrefix}${i}" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${m.color}"/></marker>`
  ).join('');
  // Arrows sharing the same squares (promotions to different pieces) are spread sideways, a few
  // units apart, so a strip of each colour stays visible.
  const SPREAD = 5;
  const lines = list.map((m,i)=>{
    const a = squareCenter(m.from), b = squareCenter(m.to);
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const same = list.filter(o=>o.from===m.from && o.to===m.to), k = same.indexOf(m);
    const shift = (k - (same.length-1)/2) * SPREAD, nx = -dy/len*shift, ny = dx/len*shift;
    a.x += nx; a.y += ny;
    const ex = b.x + nx - dx/len*14, ey = b.y + ny - dy/len*14;
    return `<line x1="${a.x}" y1="${a.y}" x2="${ex}" y2="${ey}" stroke="${m.color}" stroke-width="7" stroke-linecap="round" marker-end="url(#${keyPrefix}${i})" opacity="0.9"/>`;
  }).join('');
  svg.innerHTML = `<defs>${defs}</defs>${lines}`;
}


let poolShuffleCache = {};
// Random order for a set of ids, kept per key so it stays put across redraws; it reshuffles if
// the set itself changes. nextPosition clears Final choice's entry so a revisit gets a new order.
function stableShuffleByIds(poolKey, ids){
  const sig = ids.slice().sort().join(',');
  const cached = poolShuffleCache[poolKey];
  if(!cached || cached.sig!==sig){
    const shuffled = ids.slice();
    for(let i=shuffled.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
    }
    poolShuffleCache[poolKey] = { sig, order: shuffled };
  }
  return poolShuffleCache[poolKey].order;
}


// Board analysis score: only the two positions on the bar are compared. Same spot = 100%;
// half the bar or more apart = 0%, linear in between. The bar's usable range is 1–99%
// (both ends keep a sliver of the other colour), so "half the bar" is 49 points: in an equal
// position only a cursor at either end scores 0%, and against a forced mate, calling it equal
// (or giving the other side the edge) scores 0%.
function evalAccuracyPct(guess, truePct){
  return Math.max(0, Math.round(100 * (1 - Math.abs(guess - truePct) / 49)));
}
// A line's score in centipawns from the side to move's point of view. Mates (and anything
// beyond ±10 pawns) count as ±10 pawns, so a mating line stays comparable with the others.
function moverScore(l){
  if(l.mate!=null) return l.mate>0 ? 1000 : -1000;
  return Math.max(-1000, Math.min(1000, l.cp));
}
// Candidate moves accuracy — distance from the position's evaluation.
// The position's evaluation is the evaluation of the engine's best move (#1), so a move's
// "distance" is how far below #1 it lands, from the side to move's point of view, capped at the
// Dubious distance: how far a move has to fall to lose 10 points of winning chances (the same
// line where the review labels a move Dubious). N = how many moves the player picked (1–3).
//   100% = the engine's top N added up (#1 is 0; its #2/#3 count only if not Dubious or worse)
//     0% = N × the Dubious distance (every pick Dubious or worse)
//   Yours = your picks' capped distances added up; accuracy is where that falls between the two.
// No pairing, no ranks. Everything comes from the one combined evaluation.
function dubiousDistance(bestCp){
  const k = 0.00368208, target = winPercent(bestCp, null) - 10;
  if(target <= 0.5) return 1000; // side to move already almost lost: nothing is "10 points worse"
  const w = target/100;
  return bestCp - Math.log(w/(1-w))/k;
}
function topGoodLines(evalData, n){
  if(!evalData || !evalData.lines || !evalData.lines.length) return null;
  const rank1Pct = winPercent(evalData.lines[0].cp, evalData.lines[0].mate);
  return evalData.lines.slice(0, n).filter(l => l.uci && (rank1Pct - winPercent(l.cp, l.mate)) < 10);
}
function pickAccuracyPct(picksIn, evalData){
  if(picksIn.length===0 || !evalData || !evalData.lines || !evalData.lines.length) return null;
  const n = picksIn.length;
  const picks = picksIn.map(mv=>evalData.lines.find(l=>l.uci===mv.uci)).filter(Boolean);
  if(picks.length===0) return null;
  const bestCp = moverScore(evalData.lines[0]);
  const cap = dubiousDistance(bestCp);
  const dist = l => Math.min(cap, Math.max(0, bestCp - moverScore(l)));
  const zero = n * cap;                                                  // 0%
  const full = topGoodLines(evalData, n).reduce((t,l)=>t+dist(l), 0);    // 100%
  const yours = picks.reduce((t,l)=>t+dist(l), 0) + (n - picks.length) * cap;
  if(zero - full <= 0) return yours <= full ? 100 : 0;
  return Math.round(100 * Math.max(0, Math.min(1, (zero - yours) / (zero - full))));
}
// Final choice accuracy — each place against the best move not placed yet.
// Going down your ranking, each of your first three places compares the move you put there with
// the best of the moves you haven't placed so far: how far below it your move is (side to move,
// centipawns), capped at the Dubious distance as in Candidate moves. Same strength = the place's
// full weight, a Dubious distance or more below = 0. Places weigh 50/30/20% — your first choice,
// the move you'd play, counts most; the 4th place is whatever is left, so it isn't scored.
const RANK_WEIGHTS = [0.5, 0.3, 0.2];
function rankAccuracyPct(orderIds, cpById){
  const ids = orderIds.filter(id=>cpById[id]!=null);
  if(ids.length<2) return null;
  const left = ids.slice().sort((a,b)=>cpById[b]-cpById[a]);
  const cap = dubiousDistance(cpById[left[0]]);
  const weights = RANK_WEIGHTS.slice(0, ids.length-1);   // fewer moves evaluated: fewer places scored
  let got = 0;
  ids.forEach((id,i)=>{
    if(i < weights.length) got += weights[i] * (1 - Math.min(cap, Math.max(0, cpById[left[0]] - cpById[id])) / cap);
    left.splice(left.indexOf(id), 1);
  });
  const total = weights.reduce((t,w)=>t+w, 0);
  return total>0 ? Math.round(100*got/total) : null;
}
function pctOrDash(v){ return v!=null ? v+'%' : '—'; }


function wireDragReorder(listEl, orderArr, onDrop){
  const rows = Array.from(listEl.children);
  const rowH = rows[0] ? rows[0].getBoundingClientRect().height : 0;
  let dragRow = null, startIndex = -1, hoverIndex = -1, startY = 0;

  rows.forEach((row, i)=>{
    row.style.touchAction = 'none';
    row.addEventListener('pointerdown', e=>{
      if(parseFloat(getComputedStyle(row).opacity) < 0.5) return;   // still fading in: not grabbable yet
      dragRow = row; startIndex = i; hoverIndex = i; startY = e.clientY;
      row.setPointerCapture(e.pointerId);
      row.classList.add('dragging');
    });
    row.addEventListener('pointermove', e=>{
      if(dragRow!==row) return;
      const dy = e.clientY - startY;
      row.style.transform = `translateY(${dy}px)`;
      const shift = Math.round(dy / rowH);
      const newHover = Math.max(0, Math.min(rows.length-1, startIndex + shift));
      if(newHover !== hoverIndex){
        hoverIndex = newHover;
        rows.forEach((r,j)=>{
          if(r===dragRow) return;
          let offset = 0;
          if(startIndex < hoverIndex && j>startIndex && j<=hoverIndex) offset = -rowH;
          else if(startIndex > hoverIndex && j>=hoverIndex && j<startIndex) offset = rowH;
          r.style.transform = offset ? `translateY(${offset}px)` : '';
        });
      }
    });
    const finish = e=>{
      if(dragRow!==row) return;
      row.classList.remove('dragging');
      row.style.transform = '';
      rows.forEach(r=>{ if(r!==row) r.style.transform=''; });
      if(hoverIndex!==startIndex){
        const [id] = orderArr.splice(startIndex,1);
        orderArr.splice(hoverIndex,0,id);
      }
      dragRow = null; startIndex = -1; hoverIndex = -1;
      onDrop();
    };
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
  });
}



// ================= App state =================
const cols = ['var(--pick1)','var(--pick2)','var(--pick3)'];

// Each exercise has its own random order of positions: every position once per round, in
// random order (White or Black to play, whichever comes), never the same game twice in a row
// (across rounds too). When a round is about to run out the next one is drawn and appended, so
// the next position is always known in advance (for prefetching).
function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
// A round = every position of the activity's pool once, in random order, never two positions
// from the same game in a row when the pool allows it (across rounds too).
function drawRound(pool, prev){
  const all = pool.slice();
  const game = p=>p.gameId || (p.title + p.year);
  let best = null, bestBad = Infinity;
  for(let tries=0; tries<300; tries++){
    const round = shuffled(all), seq = prev!=null ? [prev, ...round] : round;
    const bad = seq.filter((x,i)=>i>0 && game(x)===game(seq[i-1])).length;
    if(bad < bestBad){ best = round; bestBad = bad; }
    if(!bad) break;
  }
  return best || all;
}
// Two separate tracks per exercise: practising it on its own ('analysis', …) and the routine

const ACTIVITIES = ['analysis', 'candidates', 'final'];

const TRACKS = ACTIVITIES.flatMap(a=>[a, 'r-'+a, 't-'+a]);

const orders = {}, seqBy = {}, store = {};
const isTest = t=>t.startsWith('t-') || t.startsWith('x-');   // fixed tracks: test positions, and the replay ('x-')
// Where positions come from: the master games built into the app, your own games, or both.
const SOURCES = { masters:'Masters', mine:'My games', both:'Both' };
let source = 'masters';
try{ const v = localStorage.getItem('cst.source'); if(SOURCES[v]) source = v; }catch(e){}

}
const poolOf = t=>{ if(t.startsWith('x-')) return (orders[t] || []).slice(0, 1); if(isTest(t)) return TEST_POSITIONS; const [a, src] = t.replace(/^r-/, '').split('@'); return sourcePool(a, src || 'masters'); };
function ensureTrack(t){ if(!orders[t]){ orders[t] = isTest(t) ? inOrder(poolOf(t)) : drawRound(poolOf(t)); seqBy[t] = 0; store[t] = {}; } }

function posAt(track, i){

function hasProgress(s){ return !!(s && (s.checked || (s.picks && s.picks.length) || s.moved || (s.guess!=null && s.guess!==50))); }

    const fresh = poolOf(t).filter(p=>!shown.has(p.key));   // the round goes on with what hasn't been shown

const PLAYED_LS = 'cst.played.v1';

// The first position from index i on that wasn't played today (or that you already started);

function firstAvailable(t, i){

  for(let n=0; n<len; n++, i++){
    const p = posAt(t, i);

// Is there anything still being worked on in your games (likely mistakes to check, games to scan)?
function myWorkPending(){ return myGames.some(g=>g.status==='queued' || (g.positions||[]).some(p=>p.pending)); }
// Why an exercise can't go on: positions are still coming, or everything was played today.
function waitText(a, r, short){

const canOpen = (a, r)=>progressLoaded && upcomingFor(ctx(a, r))[1] >= 0;   // never before your results are known
// Points curPos/side at the open exercise's own position.
function syncPos(){

  ensureTrack(t);

  if(!(os && os.checked)){ const j = firstAvailable(t, seqBy[t]); if(j>=0) seqBy[t] = j; }   // a review on screen stays

let selSquare = null;          // piece being moved while entering a candidate

// When searches start (each position's top-5 search is stored, so it only ever runs once):
//  - the open exercise's own position, as soon as the exercise is on screen;
//  - that exercise's NEXT position, only once its review is under way (the evaluation is in and
//    the reveal has started), so it never delays the current review.
//  - from the home page, the positions Board analysis and Final choice will open on (Candidate
//    moves only needs its evaluation at the review, with your picks in it).
function prefetchCurrent(){ if(ACTIVITIES.includes(screen)) fenEval(pos().fen); }
function prefetchNext(){
  if(!ACTIVITIES.includes(screen)) return;
  if(replayMode){ const e = replayQueue[replayIdx+1]; if(e) fenEval(e.pos.fen); return; }
  const [t, i] = nextTarget();

// Where a track will open next: its current position if that question is still open, the
// one after it if its review was already reached.
function upcomingFor(t){
  ensureTrack(t);
  const cur = posAt(t, seqBy[t]);
  if(!cur) return [t, -1];
  const s = store[t][cur.key];
  return [t, firstAvailable(t, seqBy[t] + (s && s.checked ? 1 : 0))];

// From the home page: where Board analysis and Final choice would open, and where the routine
// resumes (unless that's Candidate moves, which is only evaluated at its review).
function prefetchHome(){
  const ts = [ctx('analysis', false), ctx('final', false)];
  if(routineNext!=='candidates') ts.push(ctx(routineNext, true));
  ts.forEach(t=>{ const [x, i] = upcomingFor(t); if(i>=0) fenEval(posAt(x, i).fen); });

// ROUTINE MODE: the healthy thought process, one exercise after the other — judge the position,

function nextPosition(){

// ================= Evaluations — exactly one per exercise =================
// Candidate moves: ONE combined search over the player's picks + the game move + the engine's
// top 5 lines. Grades, Best, and the accuracy baseline all come from that one result.
function candidatesEval(p, picks){
  const disc = fenEval(p.fen);
  if(!disc) return null;
  if(evalFailed(disc)) return FAILED;
  const ucis = picks.map(m=>m.uci);
  ucis.push(p.hist.uci);
  disc.lines.slice(0, DISCOVERY_MULTIPV).forEach(l=>{ if(l.uci) ucis.push(l.uci); });
  return poolEval(p.fen, Array.from(new Set(ucis)));
}
// Final choice: the four moves to rank, picked at runtime from the app's own top 5 (so its best
// move is always one of the four) by the same rule as the position finder (see pickFinalUcis).
// When the game move isn't in the top 5, it is judged in ONE search with them, and the pick reads
// that search, so its grade is known. Shuffled so the list never gives the answer away.
function finalMoves(p){
  const disc = fenEval(p.fen);
  if(!disc) return null;
  if(evalFailed(disc)) return FAILED;
  let src = disc;
  if(!disc.lines.some(l=>l.uci===p.hist.uci)){
    const ucis = Array.from(new Set(disc.lines.slice(0, DISCOVERY_MULTIPV).map(l=>l.uci).filter(Boolean).concat(p.hist.uci)));
    src = poolEval(p.fen, ucis);
    if(!src) return null;
    if(evalFailed(src)) return FAILED;
  }
  const ucis = pickFinalUcis(p, src);
  if(!ucis.length) return FAILED;
  const list = ucis.map(u=>({ id:u, uci:u, from:u.slice(0,2), to:u.slice(2,4), san:sanForUci(p.fen, u), historical: u===p.hist.uci }));
  const order = stableShuffleByIds('final'+ctx('final')+p.key, list.map(m=>m.id));
  return order.map((id,i)=>({ ...list.find(m=>m.id===id), color: allCols[i] }));
}
// The four moves: the best move; the game move; then, down the top 5, moves whose grade isn't
// represented yet; then moves from the least-represented grades. At most one move per bad grade
// (Dubious, Mistake, Blunder), so bad moves can be told apart; only if the top 5 leave no other
// choice is a bad grade repeated.
const BAD_GRADES = ['Dubious','Mistake','Blunder'];
function pickFinalUcis(p, disc){
  const lines = disc.lines.filter(l=>l.uci);
  if(!lines.length) return [];
  const best = winPercent(lines[0].cp, lines[0].mate);
  const gradeOf = l=>l ? labelFromWinDrop(best - winPercent(l.cp, l.mate), false).label : 'unknown';
  const picks = [];   // [{uci, grade}]
  const add = (uci, grade)=>{ if(!picks.some(m=>m.uci===uci)) picks.push({ uci, grade }); };
  add(lines[0].uci, 'Good');
  add(p.hist.uci, gradeOf(lines.find(l=>l.uci===p.hist.uci)));
  const have = ()=>picks.map(m=>m.grade);
  for(const l of lines){ if(picks.length>=4) break; const g = gradeOf(l); if(!have().includes(g)) add(l.uci, g); }
  const repeatsBad = l=>BAD_GRADES.includes(gradeOf(l)) && have().includes(gradeOf(l));
  while(picks.length<4){
    const left = lines.filter(l=>!picks.some(m=>m.uci===l.uci));
    const rest = left.some(l=>!repeatsBad(l)) ? left.filter(l=>!repeatsBad(l)) : left;
    if(!rest.length) break;
    const count = g=>have().filter(x=>x===g).length;
    rest.sort((a,b)=>count(gradeOf(a)) - count(gradeOf(b)));   // stable: best first on ties
    add(rest[0].uci, gradeOf(rest[0]));
  }
  return picks.map(m=>m.uci);
}
// ...and ONE combined search over exactly those four moves — the only thing its review reads.
function finalEval(p, moves){
  return moves && !evalFailed(moves) ? poolEval(p.fen, moves.map(m=>m.uci)) : null;
}

function gameSans(p){

  return p.game && GAME_MOVES[p.game] ? GAME_MOVES[p.game].split(' ') : null;

// Vertical bar beside the board, full board height, oriented like the board: White's share at
// the bottom when White is at the bottom, at the top when the board is flipped. `pct` = White's
// winning chances; `text` is the score written inside the bar, at the winning side's end (like
// Lichess). `cursorPct` draws the player's guess; `interactive` makes the bar draggable.
function evalBarHtml(pct, text, cursorPct, interactive){
  const flip = boardFlipped();
  const black = `<div class="v-black" id="barBlack" style="height:${100-pct}%"></div>`;
  const white = `<div class="v-white" id="barWhite" style="height:${pct}%"></div>`;
  const cursor = cursorPct!=null
    ? `<div class="evalbar-cursor${interactive ? ' handle' : ''}" id="barCursor" style="${flip ? 'top' : 'bottom'}:${cursorPct}%"></div>` : '';
  return `<div class="evalbar-wrap">
      <div class="evalbar-v${interactive ? ' interactive' : ''}" id="evalBar"${interactive ? ' role="slider" aria-label="Your evaluation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'" aria-valuetext="'+text+'" tabindex="0"' : ''}>
        ${flip ? white+black : black+white}
      </div>
      <div class="evalbar-num" id="barNum" style="${barNumStyle(pct)}">${text}</div>
      ${cursor}
    </div>`;
}
// The number sits at the end of whoever is ahead, on that side's colour.
function barNumStyle(pct){
  const whiteAhead = pct>=50;
  const atBottom = whiteAhead !== boardFlipped();
  return `${atBottom ? 'bottom' : 'top'}:4px; color:${whiteAhead ? 'var(--black-fill)' : 'var(--white-fill)'};`;
}
// The player's guess is dragged in win% (that's what the bar shows), but read out as an
// evaluation score, converted with the inverse of the same win% curve the engine's own numbers
// use — so "+0.8" on your bar means the same thing as "+0.8" from the engine. Clamped to 1–99%
// (about ±12.5) since the ends of the curve run off to infinity.
function pctToCp(pct){
  const w = Math.max(1, Math.min(99, pct)) / 100;
  return Math.log(w/(1-w)) / 0.00368208;
}
function fmtGuess(pct){
  const v = pctToCp(pct)/100;
  const r = Math.round(v*10)/10;
  return (r>0 ? '+' : r<0 ? '−' : '') + Math.abs(r).toFixed(1);
}
function fmtBarScore(info){
  if(info.mate!=null) return 'M'+Math.abs(info.mate);
  const r = Math.round(info.cp/10)/10;
  return (r>0 ? '+' : r<0 ? '−' : '') + Math.abs(r).toFixed(1);
}
// ---- Board analysis recap: "<verdict>, <explanation>." ----
// Table 1 — verdict, from the accuracy (25% per board square the cursor is off).
const RECAP_VERDICTS = [
  { min:88, text:'Spot on' },               // within ½ square — no explanation added
  { min:63, text:'Close' },                 // ½ to 1½ squares off
  { min:38, text:'Estimation slightly off' },// 1½ to 2½ squares off
  { min:13, text:'Estimation off' },        // 2½ to 3½ squares off
  { min:0,  text:'Estimation way off' },    // 3½ squares or more
];
// Table 2 — explanation, from how the guess compares with the engine. "Balanced" = within
// 5 win% points of the middle (about ±0.5).
// Checked in this order; the side named is always the one the engine favours.
function recapExplanation(guess, truth){
  const gs = guess-50, ts = truth-50, BAL = 5;
  const side = ts>0 ? 'White' : 'Black', other = ts>0 ? 'Black' : 'White';
  if(Math.abs(ts)<=BAL) return Math.abs(gs)<=BAL ? 'the position is roughly balanced' : 'the position is more balanced than that';
  if(Math.abs(gs)<=BAL) return Math.abs(ts)>=30 ? `${side} is winning here` : `${side} has the advantage here`; // 30 = "clearly winning" (about ±2.5)
  if(Math.sign(gs)!==Math.sign(ts)) return `it's ${side} who's better, not ${other}`;
  return Math.abs(ts)>Math.abs(gs) ? `${side}'s advantage is bigger than that` : `${side}'s advantage is smaller than that`;
}
function analysisRecap(guess, truth){
  const acc = evalAccuracyPct(guess, truth);
  const verdict = RECAP_VERDICTS.find(v=>acc>=v.min).text;
  return acc>=88 ? verdict+'.' : `${verdict}, ${recapExplanation(guess, truth)}.`;
}
