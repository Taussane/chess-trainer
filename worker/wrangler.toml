# The account server: a Cloudflare Worker with a D1 database (see docs/accounts.md).
# Deployed by Cloudflare's GitHub connection on every push (root directory: worker).
name = "chess-trainer-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Websites allowed to call this server (comma-separated).
ALLOWED_ORIGINS = "https://chessstrategy.org,https://taussane.github.io"
# "Log in with Google": the OAuth client id from Google Cloud (public; empty = Google sign-in off).
GOOGLE_CLIENT_ID = "156223514087-0v17r4o6c77ru9hq3kafmpan91l2lunh.apps.googleusercontent.com"

# Requests per address (each Cloudflare location) and minute: everything; what makes this server ask
# another site (Lichess, Google, Chess.com). See limit() in src/index.js.
[[ratelimits]]
name = "RL_ALL"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_OUT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "chess-trainer"
database_id = "3314107c-38dd-49eb-b927-efdb5a62b346"
migrations_dir = "migrations"
